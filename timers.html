<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Royal Diamond — Crown Board</title>
<link rel="icon" type="image/png" href="/crown-gold.png">
<link rel="apple-touch-icon" href="/crown-gold.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="crown-config.js"></script>
<style>
  :root{
    --bg:#141019; --panel:#1E1826; --line:#3A3046; --gold:#D9BC7A; --gold-deep:#A8873F;
    --ivory:#F5EFE4; --dim:#9B8FA8;
    /* The boards hang in a room with the sun coming in, so a state is a lit
       tile rather than a coloured edge: saturated hue, a wash of it across the
       whole face, an outer glow, and the number lit from inside. Each colour is
       kept as r,g,b so the washes and glows can be mixed at any opacity. */
    --green:#2FE47C; --green-rgb:47,228,124; --green-lit:#8CFFC0;
    --amber:#FFC02E; --amber-rgb:255,192,46; --amber-lit:#FFE08A;
    --red:#FF5B4F;   --red-rgb:255,91,79;    --red-lit:#FFB3A9;
    --crown:#E8C97A; --crown-rgb:226,190,110; --crown-lit:#FFE49E;
    /* the sheets are read at arm's length, so they keep a quiet edge */
    --red-line:#A34038;
    /* TVs cut the edges off the picture, so nothing important goes in the margin */
    --overscan:clamp(12px, 2.6vmin, 34px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0; color:var(--ivory); font-family:'Jost',sans-serif;
    background:radial-gradient(1100px 600px at 50% -10%, #241B2F 0%, var(--bg) 60%) var(--bg);
    display:flex; flex-direction:column; padding:var(--overscan);
  }
  .hidden{display:none !important;}
  button{font-family:'Jost',sans-serif; cursor:pointer;}

  header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-bottom:10px;}
  .crest{color:var(--gold); letter-spacing:.4em; font-size:10px; text-transform:uppercase;}
  .area-title{font-family:'Cormorant Garamond',serif; font-size:clamp(22px,3.4vmin,38px); line-height:1; margin:0;}
  .head-left{display:flex; flex-direction:column; gap:4px;}
  .head-spacer{flex:1;}
  .head-stat{color:var(--dim); font-size:clamp(12px,1.5vmin,16px); letter-spacing:.06em;}
  .head-stat b{color:var(--ivory); font-weight:500;}
  .icon-btn{background:transparent; border:1px solid var(--line); color:var(--dim);
    border-radius:10px; padding:8px 12px; font-size:13px;}
  .icon-btn.on{border-color:var(--gold-deep); color:var(--gold);}
  .icon-btn.start{border-color:var(--gold); color:var(--gold); font-weight:600;}
  .icon-btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

  main{flex:1; display:grid; gap:clamp(10px,1.6vmin,22px); min-height:0;
       grid-template-columns:1fr; grid-auto-rows:minmax(0,1fr);}
  @media(min-width:640px){ main{grid-template-columns:repeat(2,1fr);} }
  @media(min-width:1100px){ main{grid-template-columns:repeat(3,1fr);} }

  .tile{
    position:relative; display:flex; flex-direction:column; justify-content:space-between;
    min-height:0; padding:clamp(10px,1.8vmin,22px);
    background:var(--panel); border:2px solid var(--line); border-radius:18px;
    cursor:pointer; overflow:hidden; transition:border-color .2s, background .2s;
  }
  .tile:focus{outline:none;}
  .tile:focus-visible, .tile.dpad{outline:4px solid var(--gold); outline-offset:-2px;}
  .t-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .t-name{font-family:'Cormorant Garamond',serif; font-size:clamp(22px,3.4vmin,42px); line-height:1;}
  .t-job{font-size:clamp(12px,1.7vmin,20px); color:var(--gold); letter-spacing:.06em;
    text-transform:uppercase;}
  .t-mid{display:flex; align-items:center; justify-content:center; gap:clamp(6px,1.4vmin,18px);
    flex:1; min-height:0;}
  .t-time{font-family:'Cormorant Garamond',serif; font-variant-numeric:tabular-nums;
    font-size:clamp(40px,10vmin,120px); line-height:.95;}
  .t-mark{font-size:clamp(34px,8vmin,96px); line-height:1;}
  .t-free{color:var(--dim); font-size:clamp(15px,2.2vmin,26px);}
  .t-foot{font-size:clamp(10px,1.35vmin,15px); color:var(--dim); letter-spacing:.1em;
    text-transform:uppercase; text-align:center;}

  .tile.run{
    background:linear-gradient(158deg, rgba(var(--green-rgb),.28), rgba(var(--green-rgb),.22) 58%,
              rgba(var(--green-rgb),.18)), var(--panel);
    border-color:var(--green);
    box-shadow:0 0 34px rgba(var(--green-rgb),.42), 0 0 96px rgba(var(--green-rgb),.20);
  }
  .tile.run .t-time{color:var(--green-lit);
    text-shadow:0 0 12px rgba(var(--green-rgb),.95), 0 0 40px rgba(var(--green-rgb),.55);}

  .tile.warn{
    background:linear-gradient(158deg, rgba(var(--amber-rgb),.28), rgba(var(--amber-rgb),.22) 58%,
              rgba(var(--amber-rgb),.18)), var(--panel);
    border-color:var(--amber);
    box-shadow:0 0 34px rgba(var(--amber-rgb),.45), 0 0 96px rgba(var(--amber-rgb),.22);
  }
  .tile.warn .t-time{color:var(--amber-lit);
    text-shadow:0 0 12px rgba(var(--amber-rgb),.95), 0 0 40px rgba(var(--amber-rgb),.58);}

  .tile.over{
    background:linear-gradient(158deg, rgba(var(--red-rgb),.30), rgba(var(--red-rgb),.22) 58%,
              rgba(var(--red-rgb),.18)), var(--panel);
    border-color:var(--red);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .tile.over .t-time{color:var(--red-lit);
    text-shadow:0 0 14px rgba(var(--red-rgb),1), 0 0 44px rgba(var(--red-rgb),.62);}

  .tile.crown{
    background:linear-gradient(158deg, rgba(var(--crown-rgb),.26), rgba(var(--crown-rgb),.22) 58%,
              rgba(var(--crown-rgb),.18)), var(--panel);
    border-color:var(--crown);
    box-shadow:0 0 34px rgba(var(--crown-rgb),.44), 0 0 100px rgba(var(--crown-rgb),.22);
  }
  .tile.crown .t-time{color:var(--crown-lit); font-size:clamp(20px,3.2vmin,38px);
    text-shadow:0 0 12px rgba(var(--crown-rgb),.9), 0 0 36px rgba(var(--crown-rgb),.5);}
  .tile.crown .t-mark{filter:drop-shadow(0 0 16px rgba(var(--crown-rgb),.85));}

  .tile.sad{
    background:linear-gradient(158deg, rgba(var(--red-rgb),.22), rgba(var(--red-rgb),.22) 58%,
              rgba(var(--red-rgb),.18)), var(--panel);
    border-color:var(--red);
    box-shadow:0 0 30px rgba(var(--red-rgb),.34), 0 0 84px rgba(var(--red-rgb),.15);
  }
  .tile.sad .t-time{color:var(--red-lit); font-size:clamp(20px,3.2vmin,38px);
    text-shadow:0 0 12px rgba(var(--red-rgb),.9), 0 0 36px rgba(var(--red-rgb),.5);}
  /* she is on the floor, but on the other kind of job — shown so nobody starts
     a second one for her by mistake */
  .tile.elsewhere{opacity:.62; border-style:dashed;}
  .tile.elsewhere .t-time{color:var(--dim); font-size:clamp(26px,4.4vmin,52px);}
  /* The over-limit pulse carries the outer glow as well, because the animation
     owns box-shadow on this tile — it breathes between lit and brighter still,
     never down to nothing. */
  @keyframes pulse{
    0%,100%{box-shadow:0 0 30px rgba(var(--red-rgb),.40), 0 0 84px rgba(var(--red-rgb),.18),
                       inset 0 0 0 0 rgba(var(--red-rgb),0);}
    50%    {box-shadow:0 0 54px rgba(var(--red-rgb),.72), 0 0 132px rgba(var(--red-rgb),.32),
                       inset 0 0 70px 0 rgba(var(--red-rgb),.22);}}
  .t-flag{position:absolute; top:9px; right:12px; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--gold-deep);}
  .bar{position:absolute; left:0; bottom:0; height:5px; width:0; background:currentColor; opacity:.9;
    box-shadow:0 0 14px currentColor;}
  .tile.run .bar{color:var(--green);} .tile.warn .bar{color:var(--amber);} .tile.over .bar{color:var(--red);}

  .reminder{text-align:center; padding-top:clamp(8px,1.4vmin,16px); color:var(--gold-deep);
    font-size:clamp(11px,1.6vmin,19px); letter-spacing:.14em; text-transform:uppercase;}

  .veil{position:fixed; inset:0; background:rgba(10,7,14,.78); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .sheet{width:100%; max-width:460px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:22px; max-height:88vh; overflow:auto;}
  .sheet h2{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:27px; margin:0 0 4px; text-align:center;}
  .sheet .sub{color:var(--dim); font-size:13px; text-align:center; margin:0 0 16px;}
  .btn{display:block; width:100%; padding:16px 18px; margin-top:10px; border-radius:14px;
    border:1px solid var(--line); background:transparent; color:var(--ivory); font-size:17px; text-align:left;}
  .btn small{display:block; color:var(--dim); font-size:12px; margin-top:3px;}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:#1A1420; font-weight:600; text-align:center;}
  .btn.gold{border-color:var(--gold-deep); color:var(--gold);}
  .btn.danger{border-color:var(--red-line); color:var(--red);}
  .btn.quiet{color:var(--dim); text-align:center; font-size:15px; padding:13px;}
  .btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .pinbox{width:100%; padding:16px; margin-top:6px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg); color:var(--ivory); font-size:24px; text-align:center; letter-spacing:.5em;
    font-family:'Jost',sans-serif;}
  .err{color:var(--red); font-size:13px; text-align:center; margin-top:10px; min-height:18px;}

  /* Only ever on screen when the browser has refused to make a sound until
     somebody touches the page. One tap and it is gone for the rest of the day. */
  .sound-prompt{position:fixed; left:50%; transform:translateX(-50%);
    bottom:clamp(12px,2.4vmin,28px); z-index:60; border:0; border-radius:999px;
    background:var(--gold); color:#1A1420; font-family:'Jost',sans-serif; font-weight:600;
    font-size:clamp(14px,2vmin,22px); padding:clamp(10px,1.6vmin,16px) clamp(18px,3vmin,32px);
    box-shadow:0 6px 26px rgba(0,0,0,.55); cursor:pointer;}
  .sound-prompt[hidden]{display:none;}
  .sound-prompt:focus-visible{outline:3px solid var(--ivory); outline-offset:3px;}

  .center-wrap{max-width:460px; margin:auto; text-align:center;}
  .center-wrap h1{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:34px; margin:8px 0 4px;}
  .setup-warn{background:var(--panel); border:1px solid var(--red-line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; font-size:14px; line-height:1.5;}
</style>
</head>
<body>

<!-- ============================================================
     Firebase config — every screen syncs through the 'timers' path
     ============================================================ -->
<script>
const firebaseConfig = {
  databaseURL: "https://royal-diamond-1031c-default-rtdb.firebaseio.com"
};
</script>
<!-- ============================================================ -->

<div id="setupWarn" class="setup-warn hidden">
  <b>Setup needed:</b> the Firebase config has not been pasted into this file yet,
  so the boards cannot sync between screens.
</div>

<div id="pickPage" class="center-wrap hidden">
  <div class="crest">Royal ◆ Diamond</div>
  <h1>Crown Board</h1>
  <p style="color:var(--dim);font-size:13px;">Which screen is this?</p>
  <a class="btn gold" style="text-decoration:none;" href="?area=manicure">💅 Manicure</a>
  <a class="btn gold" style="text-decoration:none;" href="?area=pedicure">🦶 Pedicure</a>
</div>

<header id="boardHead" class="hidden">
  <div class="head-left">
    <div class="crest">Royal ◆ Diamond</div>
    <h1 class="area-title" id="areaTitle">Board</h1>
  </div>
  <div class="head-spacer"></div>
  <div class="head-stat" id="headStat"></div>
  <button class="icon-btn start" onclick="startSheet()">＋ Start</button>
  <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔔 Sound</button>
  <button class="icon-btn" onclick="toggleFull()">⛶ Full screen</button>
  <button class="icon-btn" id="otherAreaBtn" onclick="goOther()">Switch</button>
</header>
<main id="board" class="hidden"></main>
<div id="reminder" class="reminder hidden">No press → no 👑 → no commission on that job</div>

<button id="soundPrompt" class="sound-prompt" onclick="enableSoundFromPrompt()" hidden>🔊 Tap to enable sound</button>

<div id="veil" class="veil hidden" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ============================================================================
   Royal Diamond — Crown Board
   ----------------------------------------------------------------------------
   The timer follows the TECHNICIAN, not the seat. Helen does a manicure, then a
   pedicure, then moves to another chair — it is the same woman with the same
   clock, so she has exactly one job running at a time and it counts DOWN from
   her crown limit for that kind of work.

   Green while there is time, amber for the last fifteen minutes with a chime,
   red once it runs out and keeps counting the overrun. Finish in time and the
   tile keeps a crown; finish late — or never press start at all — and it keeps
   a sad face. Every finished job is filed for the commission step to read.

   The roster and the limits live in crown-config.js. Add a technician there.

   Firebase layout, all under the 'timers' path the screens share:
     timers/ops/<key>/name            who she is
     timers/ops/<key>/current         the job running right now (one at a time)
     timers/ops/<key>/last/<type>     her last finished manicure / pedicure
     timers/sessions/<pushId>         one permanent record per finished job
   ========================================================================== */

const C = window.CROWN;
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const areaKey = (qs.get('area')||'').toLowerCase();
const AREA = C.types[areaKey] ? areaKey : null;
const OTHER = AREA === 'manicure' ? 'pedicure' : 'manicure';

let db = null, ops = {}, srvOffset = 0, audioCtx = null, audioBus = null, soundOn = true;
let ownerCloudHash = '';
const phase = {};    // operator key -> colour last seen, so the chime fires on the crossing only
const tiles = {};
const now = () => Date.now() + srvOffset;

/* ── Firebase ─────────────────────────────────────────────────────────────── */
const configured = firebaseConfig && firebaseConfig.databaseURL;
if (configured) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  // Clocks differ from screen to screen; the server's is the one they agree on.
  db.ref('.info/serverTimeOffset').on('value', s => { srvOffset = s.val() || 0; });
  db.ref('timers/ops').on('value', s => { ops = s.val() || {}; paint(); });
  db.ref('rdns_owner_pin_v1').on('value',
    s => { const v = s.val(); try {
            const o = typeof v === 'string' ? JSON.parse(v) : v;
            if (o && typeof o.hash === 'string' && o.hash.length === 64) ownerCloudHash = o.hash;
          } catch(e){} },
    () => {}
  );
} else {
  $('setupWarn').classList.remove('hidden');
}

/* ── page setup ───────────────────────────────────────────────────────────── */
if (!AREA) {
  $('pickPage').classList.remove('hidden');
} else {
  document.title = 'Royal Diamond — ' + C.types[AREA].label + ' Board';
  $('boardHead').classList.remove('hidden');
  $('board').classList.remove('hidden');
  $('reminder').classList.remove('hidden');
  $('areaTitle').textContent = C.types[AREA].label;
  $('otherAreaBtn').textContent = C.types[OTHER].label + ' →';
  buildBoard();
  requestWake();
  setInterval(paint, 500);
  paint();
}

function buildBoard(){
  const host = $('board');
  host.innerHTML = '';
  C.operators.forEach(o => {
    const el = document.createElement('div');
    el.className = 'tile free';
    el.tabIndex = 0;
    el.setAttribute('role','button');
    el.innerHTML =
      `<div class="t-flag hidden"></div>
       <div class="t-head"><span class="t-name">${o.name}</span><span class="t-job"></span></div>
       <div class="t-mid">
         <span class="t-time hidden">0:00</span>
         <span class="t-mark hidden"></span>
         <span class="t-free">Free</span>
       </div>
       <div class="t-foot"></div>
       <div class="bar"></div>`;
    el.onclick = () => tapTile(o.key);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapTile(o.key); } };
    host.appendChild(el);
    tiles[o.key] = {
      el, job: el.querySelector('.t-job'), time: el.querySelector('.t-time'),
      mark: el.querySelector('.t-mark'), free: el.querySelector('.t-free'),
      foot: el.querySelector('.t-foot'), flag: el.querySelector('.t-flag'),
      bar: el.querySelector('.bar')
    };
  });
}

/* ── painting the wall board ──────────────────────────────────────────────── */
function paint(){
  if (!AREA) return;
  const t = now();
  let running = 0, late = 0, crowns = 0;

  C.operators.forEach(o => {
    const rec = ops[o.key] || {}, ui = tiles[o.key];
    const cur = rec.current, last = (rec.last || {})[AREA];
    ui.el.className = 'tile' + (ui.el.classList.contains('dpad') ? ' dpad' : '');
    ui.mark.classList.add('hidden');
    ui.flag.classList.add('hidden');
    ui.time.classList.add('hidden');
    ui.free.classList.add('hidden');
    ui.bar.style.width = '0';

    // 1. she is working on THIS kind of job — the countdown this screen is for
    if (cur && cur.type === AREA) {
      running++;
      const limitMs = (cur.limitMin || 60) * 60000;
      const leftMs = cur.startAt + limitMs - t;
      const state = leftMs <= 0 ? 'over' : (leftMs <= C.warnMs ? 'warn' : 'run');
      if (state === 'over') late++;
      ui.el.classList.add(state);
      ui.job.textContent = C.types[AREA].icon + ' ' + C.types[AREA].label;
      ui.time.classList.remove('hidden');
      ui.time.textContent = leftMs <= 0 ? '+' + fmt(-leftMs) : fmt(leftMs);
      ui.bar.style.width = Math.max(0, Math.min(100, leftMs / limitMs * 100)) + '%';
      ui.foot.textContent = leftMs <= 0 ? 'Over the limit · tap to finish'
                                        : cur.limitMin + ' min job · tap to finish';
      // Amber and the chime arrive together, and only on the crossing — a board
      // opened mid-job does not chime for something that already happened.
      if (phase[o.key] === 'run' && state === 'warn') chimeWarn();
      phase[o.key] = state;
      return;
    }

    // 2. she is busy on the other kind of job, over on the other screen
    if (cur) {
      const limitMs = (cur.limitMin || 60) * 60000;
      const leftMs = cur.startAt + limitMs - t;
      ui.el.classList.add('elsewhere');
      ui.job.textContent = C.types[cur.type].icon + ' ' + C.types[cur.type].label;
      ui.time.classList.remove('hidden');
      ui.time.textContent = leftMs <= 0 ? '+' + fmt(-leftMs) : fmt(leftMs);
      ui.foot.textContent = 'On a ' + C.types[cur.type].label.toLowerCase() + ' · tap to finish';
      phase[o.key] = null;
      return;
    }

    // 3. free — but showing how her last job of this kind ended
    if (last) {
      if (last.crown) crowns++;
      ui.el.classList.add(last.crown ? 'crown' : 'sad');
      ui.job.textContent = C.types[AREA].icon + ' ' + C.types[AREA].label;
      ui.time.classList.remove('hidden');
      ui.time.textContent = last.noPress ? 'no press'
        : Math.round(last.elapsed/60000) + ' / ' + last.limitMin + ' min';
      ui.mark.classList.remove('hidden');
      ui.mark.textContent = last.crown ? '👑' : '😢';
      ui.foot.textContent = last.crown ? 'Crown earned · tap to start next'
                                       : 'No crown · tap to start next';
      if (last.ovr) { ui.flag.classList.remove('hidden'); ui.flag.textContent = 'adjusted'; }
    } else {
      ui.el.classList.add('free');
      ui.job.textContent = '';
      ui.free.classList.remove('hidden');
      ui.foot.textContent = 'Tap to start';
    }
    phase[o.key] = null;
  });

  $('headStat').innerHTML = `<b>${running}</b> running · <b>${late}</b> over · <b>${crowns}</b> 👑`;
}

function fmt(ms){
  const s = Math.floor(Math.max(0, ms)/1000), h = Math.floor(s/3600);
  const m = Math.floor(s/60) % 60, ss = s % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : String(m)) + ':' + String(ss).padStart(2,'0');
}
function today(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ── tapping ──────────────────────────────────────────────────────────────── */
function tapTile(key){
  unlockAudio();
  const rec = ops[key] || {};
  if (rec.current) return runningSheet(key, rec.current);
  // a finished tile opens the verdict — start the next, or put the crown right
  if ((rec.last || {})[AREA]) return tapFinished(key, AREA);
  return whichType(key);
}

// The header's ＋ Start: pick the woman first, then the kind of job.
function startSheet(){
  unlockAudio();
  const free = C.operators.filter(o => !(ops[o.key] || {}).current);
  const busy = C.operators.filter(o =>  (ops[o.key] || {}).current);
  openSheet(`
    <h2>Start a job</h2>
    <p class="sub">Who is starting?</p>
    ${free.map(o => `<button class="btn gold" onclick="whichType('${o.key}')">${o.name}</button>`).join('')}
    ${free.length ? '' : '<p class="sub">Everyone has a job running.</p>'}
    ${busy.map(o => {
      const cur = ops[o.key].current;
      return `<button class="btn" onclick="runningSheet('${o.key}', null)">${o.name}
        <small>Already on a ${C.types[cur.type].label.toLowerCase()} — tap to finish it</small></button>`;
    }).join('')}
    <button class="btn quiet" onclick="closeSheet()">Cancel</button>`);
}

// Manicure or pedicure — this screen's kind first, because that is usually it.
function whichType(key){
  const o = C.find(key);
  if (!o) return closeSheet();
  const mine = AREA || 'manicure', other = AREA ? OTHER : 'pedicure';
  openSheet(`
    <h2>${o.name}</h2>
    <p class="sub">What is she starting?</p>
    <button class="btn primary" onclick="startJob('${o.key}','${mine}')">
      ${C.types[mine].icon} ${C.types[mine].label} — ${o[mine]} min</button>
    <button class="btn gold" onclick="startJob('${o.key}','${other}')">
      ${C.types[other].icon} ${C.types[other].label} — ${o[other]} min
      <small>Shows on the ${C.types[other].label.toLowerCase()} screen</small></button>
    <button class="btn danger" onclick="noPressSheet('${o.key}')">
      😢 She finished one without pressing start<small>Records the job with no crown</small></button>
    <button class="btn quiet" onclick="closeSheet()">Cancel</button>`);
}

function runningSheet(key, cur){
  const o = C.find(key);
  cur = cur || (ops[key] || {}).current;
  if (!o || !cur) return closeSheet();
  const leftMs = cur.startAt + cur.limitMin*60000 - now();
  openSheet(`
    <h2>${o.name}</h2>
    <p class="sub">${C.types[cur.type].icon} ${C.types[cur.type].label} ·
      ${leftMs > 0 ? fmt(leftMs) + ' left' : fmt(-leftMs) + ' over'} of ${cur.limitMin} min</p>
    <button class="btn primary" onclick="finishJob('${o.key}')">✓ Finish
      ${leftMs > 0 ? `<small>In time — this one earns the crown 👑</small>`
                   : `<small>Over the limit — this one is a 😢</small>`}</button>
    ${now() - cur.startAt < C.undoMs
      ? `<button class="btn quiet" onclick="cancelJob('${o.key}')">Started by mistake — undo</button>`
      : `<button class="btn quiet" onclick="ownerCancel('${o.key}')">Started by mistake — needs reception</button>`}
    <button class="btn quiet" onclick="closeSheet()">Close</button>`);
}

// A job done with no press at all: it still happened, so it is still recorded —
// as the sad face the reminder line promises.
function noPressSheet(key){
  const o = C.find(key);
  openSheet(`
    <h2>${o.name}</h2>
    <p class="sub">Which job was finished without pressing start?</p>
    ${Object.keys(C.types).map(ty => `<button class="btn danger" onclick="noPress('${o.key}','${ty}')">
      ${C.types[ty].icon} ${C.types[ty].label}<small>Filed with no crown</small></button>`).join('')}
    <button class="btn quiet" onclick="closeSheet()">Cancel</button>`);
}

/* ── the one way in and out of a job ──────────────────────────────────────────
   Every start and finish goes through these, and they are published on
   window.CrownBoard at the bottom of this file. The Wi-Fi buttons will call the
   same functions — double press starts a manicure, triple press a pedicure and
   a long press finishes — so there is never a second copy of the rules. ---- */
function startJob(who, type){
  closeSheet();
  const o = C.find(who);
  if (!db || !o || !C.types[type]) return;
  // One job per technician. Starting again while she is running would lose the
  // first one, so the second press is turned into a question instead.
  if ((ops[o.key] || {}).current) return runningSheet(o.key, null);
  phase[o.key] = null;
  db.ref('timers/ops/' + o.key).update({
    name: o.name,
    current: { type, startAt: now(), limitMin: o[type] || 60 }
  }).catch(dbErr);
}

function finishJob(who){
  closeSheet();
  const o = C.find(who);
  const cur = o && (ops[o.key] || {}).current;
  if (!db || !cur) return;
  const endAt = now(), elapsed = Math.max(0, endAt - cur.startAt);
  const crown = elapsed < cur.limitMin * 60000;      // finished with time left
  const id = db.ref('timers/sessions').push().key;
  db.ref('timers').update({
    ['ops/' + o.key + '/current']: null,
    ['ops/' + o.key + '/last/' + cur.type]: {
      type: cur.type, startAt: cur.startAt, endAt, elapsed,
      limitMin: cur.limitMin, crown, sessionId: id
    },
    ['sessions/' + id]: {
      id, operator: o.name, operatorKey: o.key, type: cur.type, area: cur.type,
      startAt: cur.startAt, endAt, elapsedMs: elapsed,
      elapsedMin: Math.round(elapsed/60000), limitMin: cur.limitMin,
      crown, day: today(endAt), v: 2
    }
  }).catch(dbErr);
  phase[o.key] = null;
  if (crown) fanfare(); else sadTone();
}

function cancelJob(who){
  closeSheet();
  const o = C.find(who);
  const cur = o && (ops[o.key] || {}).current;
  if (!db || !cur) return;
  if (now() - cur.startAt >= C.undoMs) return ownerCancel(o.key);
  db.ref('timers/ops/' + o.key + '/current').remove().catch(dbErr);
}

// Never started: no crown, but the job is still on the books.
function noPress(who, type){
  closeSheet();
  const o = C.find(who);
  if (!db || !o || !C.types[type]) return;
  const at = now();
  const id = db.ref('timers/sessions').push().key;
  db.ref('timers').update({
    ['ops/' + o.key + '/name']: o.name,
    ['ops/' + o.key + '/last/' + type]: {
      type, startAt: at, endAt: at, elapsed: 0,
      limitMin: o[type] || 60, crown:false, noPress:true, sessionId: id
    },
    ['sessions/' + id]: {
      id, operator: o.name, operatorKey: o.key, type, area: type,
      startAt: at, endAt: at, elapsedMs: 0, elapsedMin: 0,
      limitMin: o[type] || 60, crown:false, noPress:true, day: today(at), v: 2
    }
  }).catch(dbErr);
  sadTone();
}

/* ── reception / owner override ───────────────────────────────────────────── */
function override(key, type, giveCrown){
  const last = ((ops[key] || {}).last || {})[type];
  if (!last) return closeSheet();
  askOwner(() => {
    const upd = { ['ops/' + key + '/last/' + type + '/crown']: giveCrown,
                  ['ops/' + key + '/last/' + type + '/ovr']: true };
    if (last.sessionId) {
      upd['sessions/' + last.sessionId + '/crown'] = giveCrown;
      upd['sessions/' + last.sessionId + '/overridden'] = true;
      upd['sessions/' + last.sessionId + '/overriddenAt'] = now();
    }
    db.ref('timers').update(upd).catch(dbErr);
    closeSheet();
    if (giveCrown) fanfare();
  });
}
// Clearing wipes the tile only — the session it filed stays, because that is
// what the commission will be paid from.
function clearTile(key, type){
  askOwner(() => {
    db.ref('timers/ops/' + key + '/last/' + type).remove().catch(dbErr);
    closeSheet();
  });
}
function ownerCancel(key){
  askOwner(() => {
    db.ref('timers/ops/' + key + '/current').remove().catch(dbErr);
    closeSheet();
  });
}

/* ── owner password ───────────────────────────────────────────────────────── */
// The same check the rest of the site uses: nothing but SHA-256 hashes, no
// password in this file.
function ownerHashes(){
  const ls = k => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } };
  return [ls('rdns_pin_hash'), ls('rdns_owner_cloud_hash'), ownerCloudHash, ls('rdns_recovery_hash')]
    .filter(h => h && h.length === 64);
}
function askOwner(onOk){
  if (!ownerHashes().length) {
    return openSheet(`
      <h2>Owner password needed</h2>
      <p class="sub">This screen has never been signed in, so it does not know the
      owner password. Do this change on the reception laptop instead.</p>
      <button class="btn quiet" onclick="closeSheet()">Close</button>`);
  }
  openSheet(`
    <h2>Owner password</h2>
    <p class="sub">PIN or 8-digit recovery code</p>
    <input class="pinbox" id="pinBox" type="password" inputmode="numeric" autocomplete="off">
    <div class="err" id="pinErr"></div>
    <button class="btn primary" id="pinOk">Unlock</button>
    <button class="btn quiet" onclick="closeSheet()">Cancel</button>`);
  const box = $('pinBox');
  const submit = () => {
    const h = rdSha256(String(box.value || '').trim());
    if (h && ownerHashes().indexOf(h) !== -1) onOk();
    else { $('pinErr').textContent = 'Wrong password'; box.value = ''; box.focus(); }
  };
  $('pinOk').onclick = submit;
  box.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(() => box.focus(), 60);
}

// SHA-256, byte-for-byte the implementation the main app verifies against.
function rdSha256(ascii){
  function rr(v,a){return((v>>>a)|(v<<(32-a)))>>>0;}
  var mW=Math.pow,mC=mW(2,32),i,j,res='';
  var words=[],aL=ascii.length*8;
  var h=rdSha256.h=rdSha256.h||[],k=rdSha256.k=rdSha256.k||[],pC=k.length;
  var isC={};
  for(var cand=2;pC<64;cand++){
    if(!isC[cand]){
      for(i=0;i<313;i+=cand)isC[i]=cand;
      h[pC]=(mW(cand,.5)*mC)|0;
      k[pC++]=(mW(cand,1/3)*mC)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return'';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(aL/mC)|0;
  words[words.length]=aL;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oH=h.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=h[0],e=h[4];
      var t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;
    }
    for(i=0;i<8;i++)h[i]=(h[i]+oH[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){
    var b=(h[i]>>(j*8))&255;
    res+=((b<16)?0:'')+b.toString(16);
  }
  return res;
}

/* ── sheets ───────────────────────────────────────────────────────────────── */
function openSheet(html){
  $('sheet').innerHTML = html;
  $('veil').classList.remove('hidden');
  const first = $('sheet').querySelector('input, button');
  if (first) setTimeout(() => first.focus(), 40);
}
function closeSheet(){ $('veil').classList.add('hidden'); $('sheet').innerHTML = ''; }

function dbErr(err){
  openSheet(`<h2>Could not save</h2>
    <p class="sub">${(err && err.message) || 'Unknown error'}<br><br>
    This usually means the database rules are blocking the "timers" section.</p>
    <button class="btn quiet" onclick="closeSheet()">Close</button>`);
}

// A finished tile is where the owner puts a verdict right.
function tapFinished(key, type){
  const last = ((ops[key] || {}).last || {})[type];
  const o = C.find(key);
  if (!last || !o) return;
  openSheet(`
    <h2>${o.name}</h2>
    <p class="sub">${C.types[type].label} · ${last.noPress ? 'never started' :
      Math.round(last.elapsed/60000) + ' min of ' + last.limitMin} ·
      ${last.crown ? 'crown earned 👑' : 'no crown 😢'}</p>
    <button class="btn primary" onclick="whichType('${key}')">Start her next job</button>
    ${last.crown
      ? `<button class="btn danger" onclick="override('${key}','${type}',false)">😢 Take the crown back<small>Needs the owner password</small></button>`
      : `<button class="btn gold" onclick="override('${key}','${type}',true)">👑 Give the crown anyway<small>Needs the owner password</small></button>`}
    <button class="btn danger" onclick="clearTile('${key}','${type}')">🗑 Clear this tile<small>Needs the owner password</small></button>
    <button class="btn quiet" onclick="closeSheet()">Close</button>`);
}

/* ── TV remote ────────────────────────────────────────────────────────────────
   A Fire Stick has no pointer: the D-pad sends arrow keys and OK sends Enter.
   Arrows walk the tiles (or the buttons in an open sheet), Back closes. ----- */
function dpadTargets(){
  if (!$('veil').classList.contains('hidden')) return [...$('sheet').querySelectorAll('input, button')];
  return AREA ? C.operators.map(o => tiles[o.key].el) : [];
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack') {
    if (!$('veil').classList.contains('hidden') && e.target.tagName !== 'INPUT') { e.preventDefault(); closeSheet(); }
    return;
  }
  if (!e.key.startsWith('Arrow')) return;
  const list = dpadTargets();
  if (!list.length) return;
  const inSheet = !$('veil').classList.contains('hidden');
  const cols = inSheet ? 1 : (window.innerWidth >= 1100 ? 3 : window.innerWidth >= 640 ? 2 : 1);
  let i = list.indexOf(document.activeElement);
  if (i === -1) i = 0;
  else if (e.key === 'ArrowRight') i += inSheet ? 0 : 1;
  else if (e.key === 'ArrowLeft')  i -= inSheet ? 0 : 1;
  else if (e.key === 'ArrowDown')  i += inSheet ? 1 : cols;
  else if (e.key === 'ArrowUp')    i -= inSheet ? 1 : cols;
  if (i < 0 || i >= list.length) return;
  e.preventDefault();
  list.forEach(el => el.classList.remove('dpad'));
  list[i].classList.add('dpad');
  list[i].focus();
});

/* ── screen, sound ────────────────────────────────────────────────────────── */
function goOther(){ location.search = '?area=' + OTHER; }
function toggleFull(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
}
function toggleSound(){
  soundOn = !soundOn;
  $('soundBtn').classList.toggle('on', soundOn);
  $('soundBtn').textContent = soundOn ? '🔔 Sound' : '🔕 Muted';
  if (soundOn) { unlockAudio(); chimeWarn(); }
  else syncSoundPrompt();
}
/* The board lives on a TV across the room, so the sounds are driven hard —
   close to full scale rather than the quiet levels that suited a phone held in
   the hand. Every note goes through a limiter before the speakers: the crown
   sparkle stacks six notes on top of each other, and without the limiter those
   overlapping peaks would sum past full scale and tear. The limiter holds them
   just under it, and the makeup gain after it is what actually carries the
   sound across the room. */
function buildAudioChain(){
  audioBus = audioCtx.createGain();
  audioBus.gain.value = 1;
  const lim = audioCtx.createDynamicsCompressor(), t = audioCtx.currentTime;
  lim.threshold.setValueAtTime(-8, t);
  lim.knee.setValueAtTime(6, t);
  lim.ratio.setValueAtTime(12, t);
  lim.attack.setValueAtTime(0.003, t);
  lim.release.setValueAtTime(0.25, t);
  // Measured, not guessed: rendering these three sounds through this chain
  // offline puts the loudest of them (the crown sparkle) at about 0.89 of full
  // scale with no clipped samples at all. Raising it further only squashes the
  // sparkle flatter for a fraction of a decibel, so this is where it stops.
  const makeup = audioCtx.createGain();
  makeup.gain.value = 0.98;
  audioBus.connect(lim).connect(makeup).connect(audioCtx.destination);
}
function unlockAudio(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    buildAudioChain();
  }
  if (audioCtx.state === 'suspended'){
    try{ audioCtx.resume().then(syncSoundPrompt, syncSoundPrompt); }catch(e){}
    // A browser that is refusing to make a sound leaves that promise hanging
    // rather than rejecting it, so the answer never comes back and the prompt
    // would never appear. Read the state itself a moment later instead.
    setTimeout(syncSoundPrompt, 600);
  }
  else syncSoundPrompt();
}
// A TV browser will not always let a page make noise before somebody has
// touched it. Try anyway on load, and only if the try is refused ask for the
// one tap that turns the sound on — the prompt takes itself away the moment
// the audio is running, so it is never in the way for the rest of the day.
function syncSoundPrompt(){
  const el = $('soundPrompt');
  if (!el) return;
  el.hidden = !(soundOn && audioCtx && audioCtx.state !== 'running');
}
function enableSoundFromPrompt(){
  unlockAudio();
  // Answer the tap with the same chime the board uses, so the room can hear
  // straight away that it worked and at what volume.
  setTimeout(() => { syncSoundPrompt(); if (audioCtx && audioCtx.state === 'running') chimeWarn(); }, 120);
}
// Not `once` — if the first gesture is swallowed, the next tap must still be
// able to bring the sound up.
['pointerdown','keydown','touchend'].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { passive:true }));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') unlockAudio();
});
unlockAudio();

function tone(f, at, dur, peak, type){
  if (!audioBus) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(audioBus);
  o.start(at); o.stop(at + dur + .05);
}
// Fifteen minutes left: two notes, enough to look up from across the room.
function chimeWarn(){
  if (!audioCtx || !soundOn) return;
  const t0 = audioCtx.currentTime;
  tone(880, t0, .9, 1.0); tone(1174.7, t0 + .42, .9, 1.0);
}
// Crown: a bright rising sparkle.
function fanfare(){
  if (!audioCtx || !soundOn) return;
  const t0 = audioCtx.currentTime;
  [523.3,659.3,784,1046.5,1318.5,1568].forEach((f,i) => tone(f, t0 + i*.08, .45, 1.0, 'triangle'));
  [2093,2637,3136].forEach((f,i) => tone(f, t0 + .30 + i*.07, .5, .50));
}
// Over the limit, or never started: a sigh downwards.
function sadTone(){
  if (!audioCtx || !soundOn) return;
  const t0 = audioCtx.currentTime;
  [415.3, 349.2, 277.2].forEach((f,i) => tone(f, t0 + i*.26, .8, 1.0, 'triangle'));
}

let wakeLock = null;
async function requestWake(){
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && AREA) requestWake();
});
if ($('soundBtn')) $('soundBtn').classList.add('on');

/* ── the entry point the Wi-Fi buttons will use ───────────────────────────────
   One button per technician, on the wall by her station. The connector that
   receives the press calls straight into these:

       CrownBoard.start('Helen','manicure')   double press
       CrownBoard.start('Helen','pedicure')   triple press
       CrownBoard.finish('Helen')             long press

   or hand the gesture over and let the board map it:

       CrownBoard.onButton('Helen','double' | 'triple' | 'long')

   Names are matched case-insensitively against crown-config.js, so the button
   can be configured with 'Helen' or 'helen'.
   ------------------------------------------------------------------------- */
window.CrownBoard = {
  operators: () => C.operators.map(o => o.name),
  start: startJob,
  finish: finishJob,
  cancel: cancelJob,
  noPress: noPress,
  state: who => { const o = C.find(who); return o ? (ops[o.key] || null) : null; },
  onButton: (who, gesture) => {
    if (gesture === 'double') return startJob(who, 'manicure');
    if (gesture === 'triple') return startJob(who, 'pedicure');
    if (gesture === 'long')   return finishJob(who);
  }
};
</script>
