<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Royal Diamond — Crown Board</title>
<link rel="icon" type="image/png" href="/crown-gold.png">
<link rel="apple-touch-icon" href="/crown-gold.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#141019; --panel:#1E1826; --line:#3A3046; --gold:#D9BC7A; --gold-deep:#A8873F;
    --ivory:#F5EFE4; --dim:#9B8FA8;
    --green:#5FCB8C; --green-bg:#16301F; --green-line:#3E8F60;
    --amber:#F0C14B; --amber-bg:#3A2C0E; --amber-line:#A9861F;
    --red:#F2708B; --red-bg:#3A1119; --red-line:#A33A50;
    --crown-bg:#3A2C14; --crown-line:#D2AC58;
    /* TVs cut the edges off the picture, so nothing important goes in the margin */
    --overscan:clamp(12px, 2.6vmin, 34px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden;}
  body{
    margin:0; color:var(--ivory); font-family:'Jost',sans-serif;
    background:radial-gradient(1100px 600px at 50% -10%, #241B2F 0%, var(--bg) 60%) var(--bg);
    display:flex; flex-direction:column;
    padding:var(--overscan);
  }
  .hidden{display:none !important;}
  button{font-family:'Jost',sans-serif; cursor:pointer;}

  /* ── header ───────────────────────────────────────────── */
  header{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-bottom:10px;}
  .crest{color:var(--gold); letter-spacing:.4em; font-size:10px; text-transform:uppercase;}
  .area-title{font-family:'Cormorant Garamond',serif; font-size:clamp(22px,3.4vmin,38px); line-height:1; margin:0;}
  .head-left{display:flex; flex-direction:column; gap:4px;}
  .head-spacer{flex:1;}
  .head-stat{color:var(--dim); font-size:clamp(12px,1.5vmin,16px); letter-spacing:.06em;}
  .head-stat b{color:var(--ivory); font-weight:500;}
  .icon-btn{background:transparent; border:1px solid var(--line); color:var(--dim);
    border-radius:10px; padding:8px 12px; font-size:13px;}
  .icon-btn.on{border-color:var(--gold-deep); color:var(--gold);}
  .icon-btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

  /* ── board ────────────────────────────────────────────── */
  main{flex:1; display:grid; gap:clamp(10px,1.6vmin,22px); min-height:0;
       grid-template-columns:1fr; grid-auto-rows:minmax(0,1fr);}
  @media(min-width:640px){ main{grid-template-columns:repeat(2,1fr);} }
  @media(min-width:1000px){ main{grid-template-columns:repeat(3,1fr);} }

  .tile{
    position:relative; display:flex; flex-direction:column; justify-content:space-between;
    min-height:0; padding:clamp(10px,1.8vmin,22px);
    background:var(--panel); border:2px solid var(--line); border-radius:18px;
    cursor:pointer; overflow:hidden; transition:border-color .2s, background .2s;
  }
  /* A Fire Stick has no pointer — the D-pad moves this ring around the board */
  .tile:focus{outline:none;}
  .tile:focus-visible, .tile.dpad{outline:4px solid var(--gold); outline-offset:-2px;}
  .t-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .t-name{font-family:'Cormorant Garamond',serif; font-size:clamp(19px,2.8vmin,32px); line-height:1;}
  .t-op{font-size:clamp(13px,1.9vmin,22px); color:var(--gold); letter-spacing:.04em;}
  .t-mid{display:flex; align-items:center; justify-content:center; gap:clamp(6px,1.4vmin,18px); flex:1; min-height:0;}
  .t-time{font-family:'Cormorant Garamond',serif; font-variant-numeric:tabular-nums;
    font-size:clamp(40px,10vmin,120px); line-height:.95;}
  .t-mark{font-size:clamp(34px,8vmin,96px); line-height:1;}
  .t-free{color:var(--dim); font-size:clamp(15px,2.2vmin,26px);}
  .t-foot{font-size:clamp(10px,1.35vmin,15px); color:var(--dim); letter-spacing:.1em;
    text-transform:uppercase; text-align:center;}

  .tile.run{background:var(--green-bg); border-color:var(--green-line);}
  .tile.run .t-time{color:var(--green);}
  .tile.warn{background:var(--amber-bg); border-color:var(--amber-line);}
  .tile.warn .t-time{color:var(--amber);}
  .tile.over{background:var(--red-bg); border-color:var(--red-line); animation:pulse 2.2s ease-in-out infinite;}
  .tile.over .t-time{color:var(--red);}
  .tile.crown{background:var(--crown-bg); border-color:var(--crown-line);}
  .tile.crown .t-time{color:var(--gold); font-size:clamp(20px,3.2vmin,38px);}
  .tile.sad{background:var(--red-bg); border-color:var(--red-line);}
  .tile.sad .t-time{color:var(--red); font-size:clamp(20px,3.2vmin,38px);}
  @keyframes pulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(242,112,139,0);}
                   50%{box-shadow:inset 0 0 60px 0 rgba(242,112,139,.16);}}
  .t-flag{position:absolute; top:9px; right:12px; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--gold-deep);}
  .bar{position:absolute; left:0; bottom:0; height:5px; width:0; background:currentColor; opacity:.6;}
  .tile.run .bar{color:var(--green);} .tile.warn .bar{color:var(--amber);} .tile.over .bar{color:var(--red);}

  /* the rule of the house, kept in front of everyone all day */
  .reminder{text-align:center; padding-top:clamp(8px,1.4vmin,16px); color:var(--gold-deep);
    font-size:clamp(11px,1.6vmin,19px); letter-spacing:.14em; text-transform:uppercase;}

  /* ── sheets ───────────────────────────────────────────── */
  .veil{position:fixed; inset:0; background:rgba(10,7,14,.78); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .sheet{width:100%; max-width:460px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:22px; max-height:88vh; overflow:auto;}
  .sheet h2{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:27px; margin:0 0 4px; text-align:center;}
  .sheet .sub{color:var(--dim); font-size:13px; text-align:center; margin:0 0 16px;}
  .btn{display:block; width:100%; padding:16px 18px; margin-top:10px; border-radius:14px;
    border:1px solid var(--line); background:transparent; color:var(--ivory); font-size:17px; text-align:left;}
  .btn small{display:block; color:var(--dim); font-size:12px; margin-top:3px;}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:#1A1420; font-weight:600; text-align:center;}
  .btn.gold{border-color:var(--gold-deep); color:var(--gold);}
  .btn.danger{border-color:var(--red-line); color:var(--red);}
  .btn.quiet{color:var(--dim); text-align:center; font-size:15px; padding:13px;}
  .btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .pinbox{width:100%; padding:16px; margin-top:6px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg); color:var(--ivory); font-size:24px; text-align:center; letter-spacing:.5em;
    font-family:'Jost',sans-serif;}
  .err{color:var(--red); font-size:13px; text-align:center; margin-top:10px; min-height:18px;}

  /* ── area picker / setup ──────────────────────────────── */
  .center-wrap{max-width:460px; margin:auto; text-align:center;}
  .center-wrap h1{font-family:'Cormorant Garamond',serif; font-weight:500; font-size:34px; margin:8px 0 4px;}
  .setup-warn{background:var(--panel); border:1px solid var(--red-line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; font-size:14px; line-height:1.5;}
</style>
</head>
<body>

<!-- ============================================================
     Firebase config — every screen syncs through the 'timers' path
     ============================================================ -->
<script>
const firebaseConfig = {
  databaseURL: "https://royal-diamond-1031c-default-rtdb.firebaseio.com"
};
</script>
<!-- ============================================================ -->

<div id="setupWarn" class="setup-warn hidden">
  <b>Setup needed:</b> the Firebase config has not been pasted into this file yet,
  so the boards cannot sync between screens.
</div>

<!-- AREA PICKER (no ?area= in the URL) -->
<div id="pickPage" class="center-wrap hidden">
  <div class="crest">Royal ◆ Diamond</div>
  <h1>Crown Board</h1>
  <p class="sub" style="color:var(--dim);font-size:13px;">Which screen is this?</p>
  <a class="btn gold" style="text-decoration:none;" href="?area=manicure">💅 Manicure<small>6 seats · M1–M6</small></a>
  <a class="btn gold" style="text-decoration:none;" href="?area=pedicure">🦶 Pedicure<small>3 chairs · P1–P3</small></a>
</div>

<!-- BOARD -->
<header id="boardHead" class="hidden">
  <div class="head-left">
    <div class="crest">Royal ◆ Diamond</div>
    <h1 class="area-title" id="areaTitle">Board</h1>
  </div>
  <div class="head-spacer"></div>
  <div class="head-stat" id="headStat"></div>
  <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔔 Sound</button>
  <button class="icon-btn" onclick="toggleFull()">⛶ Full screen</button>
  <button class="icon-btn" id="otherAreaBtn" onclick="goOther()">Switch</button>
</header>
<main id="board" class="hidden"></main>
<div id="reminder" class="reminder hidden">No press → no 👑 → no commission on that job</div>

<!-- MODAL HOST -->
<div id="veil" class="veil hidden" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ============================================================================
   Royal Diamond — Crown Board
   ----------------------------------------------------------------------------
   The operator starts her own station and it counts DOWN from her crown limit.
   Green while there is time left, amber for the last fifteen minutes, red once
   it runs out and keeps counting the overrun. She presses Done: finished with
   time still on the clock is a crown, finished late is a sad face. Every
   finished job is filed in Firebase so the other board, the reception laptop
   and the later commission step all read the same thing.

   Firebase layout, all under the 'timers' path the screens share:
     timers/board/<area>/<station>   the tile every screen is looking at now
     timers/sessions/<pushId>        one permanent record per finished job
   ========================================================================== */

const AREAS = {
  manicure: {
    label:'Manicure', unit:'Seat', other:'pedicure',
    stations:['M1','M2','M3','M4','M5','M6'],
    askOperator:true,
    // Helen works to the hour; the other two are given the longer hand.
    limitFor: op => (op === 'Helen' ? 60 : 90)
  },
  pedicure: {
    label:'Pedicure', unit:'Chair', other:'manicure',
    stations:['P1','P2','P3'],
    askOperator:false,
    limitFor: () => 60
  }
};
const OPERATORS = ['Helen','Lissa','Hannah'];
const WARN_MS = 15*60000;    // amber, and the two-note chime, at fifteen minutes left
const UNDO_MS = 2*60000;     // a mis-tapped start can be undone this long

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const areaKey = (qs.get('area')||'').toLowerCase();
const AREA = AREAS[areaKey] || null;

let db = null, board = {}, srvOffset = 0, audioCtx = null, soundOn = true;
let ownerCloudHash = '';
const phase = {};            // station -> last colour seen, so the chime fires on the crossing only
const tiles = {};            // station -> cached DOM handles
const now = () => Date.now() + srvOffset;

/* ── Firebase ─────────────────────────────────────────────────────────────── */
const configured = firebaseConfig && firebaseConfig.databaseURL;
if (configured) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  // Clocks differ from screen to screen; the server's clock is the one they all
  // agree on, so every countdown is measured against that.
  db.ref('.info/serverTimeOffset').on('value', s => { srvOffset = s.val() || 0; });
  if (AREA) db.ref('timers/board/' + areaKey).on('value', s => { board = s.val() || {}; paint(); });
  // The owner password lives in its own node (see index.html). A board that
  // cannot read it simply sends the override to the reception laptop.
  db.ref('rdns_owner_pin_v1').on('value',
    s => { const v = s.val(); try {
            const o = typeof v === 'string' ? JSON.parse(v) : v;
            if (o && typeof o.hash === 'string' && o.hash.length === 64) ownerCloudHash = o.hash;
          } catch(e){} },
    () => {}
  );
} else {
  $('setupWarn').classList.remove('hidden');
}

/* ── page setup ───────────────────────────────────────────────────────────── */
if (!AREA) {
  $('pickPage').classList.remove('hidden');
} else {
  document.title = 'Royal Diamond — ' + AREA.label + ' Board';
  $('boardHead').classList.remove('hidden');
  $('board').classList.remove('hidden');
  $('reminder').classList.remove('hidden');
  $('areaTitle').textContent = AREA.label;
  $('otherAreaBtn').textContent = AREAS[AREA.other].label + ' →';
  buildBoard();
  requestWake();
  setInterval(paint, 500);
  paint();
}

function buildBoard(){
  const host = $('board');
  AREA.stations.forEach(st => {
    const el = document.createElement('div');
    el.className = 'tile free';
    el.tabIndex = 0;                       // reachable from a TV remote
    el.setAttribute('role','button');
    el.innerHTML =
      `<div class="t-flag hidden"></div>
       <div class="t-head"><span class="t-name">${st}</span><span class="t-op"></span></div>
       <div class="t-mid">
         <span class="t-time hidden">0:00</span>
         <span class="t-mark hidden"></span>
         <span class="t-free">Free</span>
       </div>
       <div class="t-foot"></div>
       <div class="bar"></div>`;
    el.onclick = () => tapTile(st);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapTile(st); } };
    host.appendChild(el);
    tiles[st] = {
      el, op: el.querySelector('.t-op'), time: el.querySelector('.t-time'),
      mark: el.querySelector('.t-mark'), free: el.querySelector('.t-free'),
      foot: el.querySelector('.t-foot'), flag: el.querySelector('.t-flag'),
      bar: el.querySelector('.bar')
    };
  });
}

/* ── painting the wall board ──────────────────────────────────────────────── */
function paint(){
  if (!AREA) return;
  const t = now();
  let running = 0, crowns = 0, late = 0;

  AREA.stations.forEach(st => {
    const rec = board[st], ui = tiles[st];
    ui.el.className = 'tile' + (ui.el.classList.contains('dpad') ? ' dpad' : '');
    ui.mark.classList.add('hidden');
    ui.flag.classList.add('hidden');
    ui.bar.style.width = '0';
    ui.time.classList.toggle('hidden', !rec);
    ui.free.classList.toggle('hidden', !!rec);

    if (!rec) {
      ui.el.classList.add('free');
      ui.op.textContent = '';
      ui.foot.textContent = 'Tap to start';
      phase[st] = null;
      return;
    }

    const limitMs = (rec.limitMin || 60) * 60000;
    ui.op.textContent = rec.op || '';

    if (rec.s === 'run') {
      running++;
      const left = rec.startAt + limitMs - t;          // the clock counts DOWN
      const state = left <= 0 ? 'over' : (left <= WARN_MS ? 'warn' : 'run');
      if (state === 'over') late++;
      ui.el.classList.add(state);
      ui.time.textContent = left <= 0 ? '+' + fmt(-left) : fmt(left);
      ui.bar.style.width = Math.max(0, Math.min(100, left / limitMs * 100)) + '%';
      ui.foot.textContent = left <= 0
        ? 'Over the limit · press done'
        : rec.limitMin + ' min job · press done when finished';
      // Amber and the chime arrive together, and only on the crossing — a board
      // opened mid-job does not chime for something that already happened.
      if (phase[st] === 'run' && state === 'warn') chimeWarn();
      phase[st] = state;
    } else {
      const good = !!rec.crown;
      if (good) crowns++;
      ui.el.classList.add(good ? 'crown' : 'sad');
      ui.time.textContent = Math.round(rec.elapsed/60000) + ' / ' + rec.limitMin + ' min';
      ui.mark.classList.remove('hidden');
      ui.mark.textContent = good ? '👑' : '😢';
      ui.foot.textContent = good ? 'Crown earned · tap for next' : 'Over the limit · tap for next';
      if (rec.ovr) { ui.flag.classList.remove('hidden'); ui.flag.textContent = 'adjusted'; }
      phase[st] = 'done';
    }
  });

  $('headStat').innerHTML = `<b>${running}</b> running · <b>${late}</b> over · <b>${crowns}</b> 👑`;
}

function fmt(ms){
  const s = Math.floor(Math.max(0, ms)/1000), h = Math.floor(s/3600);
  const m = Math.floor(s/60) % 60, ss = s % 60;
  return (h ? h + ':' + String(m).padStart(2,'0') : String(m)) + ':' + String(ss).padStart(2,'0');
}
function today(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ── tapping a tile ───────────────────────────────────────────────────────── */
function tapTile(st){
  unlockAudio();
  const rec = board[st];
  if (!rec)            return askStart(st);
  if (rec.s === 'run') return runningSheet(st, rec);
  return finishedSheet(st, rec);
}

// Manicure asks who is starting, because the crown limit is hers. Pedicure just
// goes — the chair is the same hour for everybody.
function askStart(st){
  if (!AREA.askOperator) return startJob(st, '');
  openSheet(`
    <h2>${AREA.unit} ${st}</h2>
    <p class="sub">Who is starting?</p>
    ${OPERATORS.map(o => `<button class="btn gold" onclick="startJob('${st}','${o}')">${o}
        <small>${AREA.limitFor(o)} minutes on the clock</small></button>`).join('')}
    <button class="btn quiet" onclick="closeSheet()">Cancel</button>`);
}

function runningSheet(st, rec){
  const left = rec.startAt + rec.limitMin*60000 - now();
  const verdict = left > 0
    ? `<small>Finishing now earns the crown 👑 (${fmt(left)} still on the clock)</small>`
    : `<small>This one is ${fmt(-left)} over — finishing now is a 😢</small>`;
  openSheet(`
    <h2>${AREA.unit} ${st}${rec.op ? ' · ' + rec.op : ''}</h2>
    <p class="sub">${left > 0 ? fmt(left) + ' left' : fmt(-left) + ' over'} of ${rec.limitMin} min</p>
    <button class="btn primary" onclick="finishJob('${st}')">✓ Done ${verdict}</button>
    ${now() - rec.startAt < UNDO_MS
      ? `<button class="btn quiet" onclick="undoStart('${st}')">Started by mistake — undo</button>`
      : `<button class="btn quiet" onclick="ownerClear('${st}')">Started by mistake — needs reception</button>`}
    <button class="btn quiet" onclick="closeSheet()">Close</button>`);
}

function finishedSheet(st, rec){
  openSheet(`
    <h2>${AREA.unit} ${st}${rec.op ? ' · ' + rec.op : ''}</h2>
    <p class="sub">${Math.round(rec.elapsed/60000)} min of ${rec.limitMin} · ${rec.crown ? 'crown earned 👑' : 'over the limit 😢'}</p>
    <button class="btn primary" onclick="tapStartNext('${st}')">Start the next job here</button>
    ${rec.crown
      ? `<button class="btn danger" onclick="override('${st}',false)">😢 Take the crown back<small>Needs the owner password</small></button>`
      : `<button class="btn gold" onclick="override('${st}',true)">👑 Give the crown anyway<small>Needs the owner password</small></button>`}
    <button class="btn danger" onclick="ownerClear('${st}')">🗑 Clear this tile<small>Needs the owner password</small></button>
    <button class="btn quiet" onclick="closeSheet()">Close</button>`);
}
function tapStartNext(st){ closeSheet(); askStart(st); }

/* ── the one way in and out of a station ──────────────────────────────────────
   Everything that starts or ends a job goes through these three functions, and
   they are published on window.CrownBoard at the bottom of this file. When the
   physical per-operator buttons are wired in, they call these — no second copy
   of the rules, no second way for a job to reach Firebase. ------------------ */
function startJob(st, op){
  closeSheet();
  if (!db || !AREA.stations.includes(st)) return;
  phase[st] = null;
  db.ref('timers/board/' + areaKey + '/' + st).set({
    s:'run', op: op || '', startAt: now(), limitMin: AREA.limitFor(op)
  }).catch(dbErr);
}

// Judge the job against the limit, show the verdict on the tile, and file the
// permanent record the commission step will read.
function finishJob(st){
  closeSheet();
  const rec = board[st];
  if (!db || !rec || rec.s !== 'run') return;
  const endAt = now(), elapsed = Math.max(0, endAt - rec.startAt);
  const crown = elapsed < rec.limitMin * 60000;      // finished with time left
  const id = db.ref('timers/sessions').push().key;
  db.ref('timers').update({
    ['board/' + areaKey + '/' + st]: {
      s:'done', op: rec.op || '', startAt: rec.startAt, endAt, elapsed,
      limitMin: rec.limitMin, crown, sessionId: id
    },
    ['sessions/' + id]: {
      id, area: areaKey, station: st, operator: rec.op || '',
      startAt: rec.startAt, endAt, elapsedMs: elapsed,
      elapsedMin: Math.round(elapsed/60000), limitMin: rec.limitMin,
      crown, day: today(endAt), v: 1
    }
  }).catch(dbErr);
  phase[st] = 'done';
  if (crown) fanfare(); else sadTone();
}

function undoStart(st){
  closeSheet();
  const rec = board[st];
  if (!db || !rec || rec.s !== 'run') return;
  if (now() - rec.startAt >= UNDO_MS) return ownerClear(st);
  db.ref('timers/board/' + areaKey + '/' + st).remove().catch(dbErr);
}

/* ── reception / owner override ───────────────────────────────────────────── */
function override(st, giveCrown){
  const rec = board[st];
  if (!rec || rec.s !== 'done') return closeSheet();
  askOwner(() => {
    const upd = { ['board/' + areaKey + '/' + st + '/crown']: giveCrown,
                  ['board/' + areaKey + '/' + st + '/ovr']: true };
    if (rec.sessionId) {
      upd['sessions/' + rec.sessionId + '/crown'] = giveCrown;
      upd['sessions/' + rec.sessionId + '/overridden'] = true;
      upd['sessions/' + rec.sessionId + '/overriddenAt'] = now();
    }
    db.ref('timers').update(upd).catch(dbErr);
    closeSheet();
    if (giveCrown) fanfare();
  });
}

// Clearing wipes the tile off the wall only — the session it already filed
// stays put, because that is what the commission will be paid from.
function ownerClear(st){
  askOwner(() => {
    db.ref('timers/board/' + areaKey + '/' + st).remove().catch(dbErr);
    closeSheet();
  });
}

/* ── owner password ───────────────────────────────────────────────────────── */
// The same check the rest of the site uses: nothing but SHA-256 hashes, no
// password in this file. rdns_pin_hash is this device's own PIN,
// rdns_owner_cloud_hash is the boss's master mirrored to every device, and the
// recovery code still works as a way in.
function ownerHashes(){
  const ls = k => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } };
  return [ls('rdns_pin_hash'), ls('rdns_owner_cloud_hash'), ownerCloudHash, ls('rdns_recovery_hash')]
    .filter(h => h && h.length === 64);
}
function askOwner(onOk){
  if (!ownerHashes().length) {
    return openSheet(`
      <h2>Owner password needed</h2>
      <p class="sub">This screen has never been signed in, so it does not know the
      owner password. Do this change on the reception laptop instead.</p>
      <button class="btn quiet" onclick="closeSheet()">Close</button>`);
  }
  openSheet(`
    <h2>Owner password</h2>
    <p class="sub">PIN or 8-digit recovery code</p>
    <input class="pinbox" id="pinBox" type="password" inputmode="numeric" autocomplete="off">
    <div class="err" id="pinErr"></div>
    <button class="btn primary" id="pinOk">Unlock</button>
    <button class="btn quiet" onclick="closeSheet()">Cancel</button>`);
  const box = $('pinBox');
  const submit = () => {
    const h = rdSha256(String(box.value || '').trim());
    if (h && ownerHashes().indexOf(h) !== -1) onOk();
    else { $('pinErr').textContent = 'Wrong password'; box.value = ''; box.focus(); }
  };
  $('pinOk').onclick = submit;
  box.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(() => box.focus(), 60);
}

// SHA-256, byte-for-byte the implementation the main app verifies against.
function rdSha256(ascii){
  function rr(v,a){return((v>>>a)|(v<<(32-a)))>>>0;}
  var mW=Math.pow,mC=mW(2,32),i,j,res='';
  var words=[],aL=ascii.length*8;
  var h=rdSha256.h=rdSha256.h||[],k=rdSha256.k=rdSha256.k||[],pC=k.length;
  var isC={};
  for(var cand=2;pC<64;cand++){
    if(!isC[cand]){
      for(i=0;i<313;i+=cand)isC[i]=cand;
      h[pC]=(mW(cand,.5)*mC)|0;
      k[pC++]=(mW(cand,1/3)*mC)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return'';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(aL/mC)|0;
  words[words.length]=aL;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oH=h.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=h[0],e=h[4];
      var t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^(~e&h[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;
    }
    for(i=0;i<8;i++)h[i]=(h[i]+oH[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){
    var b=(h[i]>>(j*8))&255;
    res+=((b<16)?0:'')+b.toString(16);
  }
  return res;
}

/* ── sheets ───────────────────────────────────────────────────────────────── */
function openSheet(html){
  $('sheet').innerHTML = html;
  $('veil').classList.remove('hidden');
  const first = $('sheet').querySelector('input, button');
  if (first) setTimeout(() => first.focus(), 40);
}
function closeSheet(){ $('veil').classList.add('hidden'); $('sheet').innerHTML = ''; }

function dbErr(err){
  openSheet(`<h2>Could not save</h2>
    <p class="sub">${(err && err.message) || 'Unknown error'}<br><br>
    This usually means the database rules are blocking the "timers" section.</p>
    <button class="btn quiet" onclick="closeSheet()">Close</button>`);
}

/* ── TV remote ────────────────────────────────────────────────────────────────
   A Fire Stick has no pointer: the D-pad sends arrow keys and OK sends Enter.
   Arrows walk the tiles (or the buttons in an open sheet), Back closes. ----- */
function dpadTargets(){
  if (!$('veil').classList.contains('hidden')) return [...$('sheet').querySelectorAll('input, button')];
  return AREA ? AREA.stations.map(st => tiles[st].el) : [];
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack') {
    if (!$('veil').classList.contains('hidden') && e.target.tagName !== 'INPUT') { e.preventDefault(); closeSheet(); }
    return;
  }
  if (!e.key.startsWith('Arrow')) return;
  const list = dpadTargets();
  if (!list.length) return;
  const inSheet = !$('veil').classList.contains('hidden');
  const cols = inSheet ? 1 : (window.innerWidth >= 1000 ? 3 : window.innerWidth >= 640 ? 2 : 1);
  let i = list.indexOf(document.activeElement);
  if (i === -1) i = 0;
  else if (e.key === 'ArrowRight') i += inSheet ? 0 : 1;
  else if (e.key === 'ArrowLeft')  i -= inSheet ? 0 : 1;
  else if (e.key === 'ArrowDown')  i += inSheet ? 1 : cols;
  else if (e.key === 'ArrowUp')    i -= inSheet ? 1 : cols;
  if (i < 0 || i >= list.length) return;
  e.preventDefault();
  list.forEach(el => el.classList.remove('dpad'));
  list[i].classList.add('dpad');
  list[i].focus();
});

/* ── screen, sound ────────────────────────────────────────────────────────── */
function goOther(){ location.search = '?area=' + AREA.other; }
function toggleFull(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
}
function toggleSound(){
  soundOn = !soundOn;
  $('soundBtn').classList.toggle('on', soundOn);
  $('soundBtn').textContent = soundOn ? '🔔 Sound' : '🔕 Muted';
  if (soundOn) { unlockAudio(); chimeWarn(); }
}
function unlockAudio(){
  if (!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio, { once:true });
document.addEventListener('keydown', unlockAudio, { once:true });

function tone(f, at, dur, peak, type){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(at); o.stop(at + dur + .05);
}
// Fifteen minutes left: two gentle notes, enough to look up.
function chimeWarn(){
  if (!audioCtx || !soundOn) return;
  const t0 = audioCtx.currentTime;
  tone(880, t0, .9, .22); tone(1174.7, t0 + .42, .9, .22);
}
// Crown: a bright rising sparkle.
function fanfare(){
  if (!audioCtx || !soundOn) return;
  const t0 = audioCtx.currentTime;
  [523.3,659.3,784,1046.5,1318.5,1568].forEach((f,i) => tone(f, t0 + i*.08, .45, .2, 'triangle'));
  [2093,2637,3136].forEach((f,i) => tone(f, t0 + .30 + i*.07, .5, .07));   // glitter on top
}
// Over the limit: a soft sigh downwards.
function sadTone(){
  if (!audioCtx || !soundOn) return;
  const t0 = audioCtx.currentTime;
  [415.3, 349.2, 277.2].forEach((f,i) => tone(f, t0 + i*.26, .8, .16, 'triangle'));
}

let wakeLock = null;
async function requestWake(){
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && AREA) requestWake();
});
if ($('soundBtn')) $('soundBtn').classList.add('on');

/* ── the entry point the physical buttons will use ────────────────────────────
   One switch per operator, wired to a little box that opens this page, will
   call these directly:
       CrownBoard.start('M1','Helen')   begin a job (limit comes from the name)
       CrownBoard.done('M1')            press Done — crown or sad, and file it
       CrownBoard.cancel('M1')          undo a start made by mistake
       CrownBoard.state('M1')           read what the tile is showing now
   ------------------------------------------------------------------------- */
window.CrownBoard = {
  get area(){ return areaKey; },
  get stations(){ return AREA ? AREA.stations.slice() : []; },
  operators: OPERATORS.slice(),
  limitFor: op => AREA ? AREA.limitFor(op) : null,
  start: startJob,
  done: finishJob,
  cancel: undoStart,
  state: st => board[st] || null
};
