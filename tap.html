<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b10">
<title>Royal Diamond</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:#0b0b10;color:#f5f2ea;
    font:500 17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow:hidden;
  }
  header{padding:18px 0 10px;text-align:center;flex:0 0 auto}
  .crown{font-size:26px;line-height:1}
  .brand{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c9a227;margin-top:6px}
  .who{font-size:27px;font-weight:700;margin-top:10px;letter-spacing:.01em}
  .whosub{font-size:12px;color:#7d7a72;margin-top:3px}

  main{flex:1 1 auto;display:flex;flex-direction:column;gap:11px;padding-bottom:12px;min-height:0}

  button.act{
    flex:1 1 0;min-height:0;width:100%;
    border:1px solid #2a2a35;border-radius:18px;
    background:#16161f;color:#f5f2ea;
    font:600 20px/1.2 inherit;
    display:flex;align-items:center;gap:14px;padding:0 20px;
    transition:transform .08s ease,background .12s ease;
  }
  button.act .ico{font-size:26px;width:34px;text-align:center;flex:0 0 auto}
  button.act .lbl{text-align:left}
  button.act .en{display:block;font-size:12px;font-weight:500;color:#8b8880;margin-top:3px;letter-spacing:.04em}
  button.act:active{transform:scale(.975);background:#1e1e2a}
  button.act[disabled]{opacity:.45}

  button.finish{background:#1b1410;border-color:#573a1c}
  button.finish .en{color:#a8845a}

  .pick{display:flex;flex-direction:column;gap:12px;flex:1 1 auto;justify-content:center}
  .pick button{
    width:100%;padding:22px;border-radius:18px;border:1px solid #2a2a35;
    background:#16161f;color:#f5f2ea;font:700 22px/1 inherit;
  }
  .pick button:active{background:#1e1e2a}
  .pickhead{text-align:center;color:#8b8880;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}

  #toast{
    position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    border-radius:14px;padding:15px 18px;font-size:16px;font-weight:600;text-align:center;
    opacity:0;transform:translateY(14px);transition:opacity .18s,transform .18s;pointer-events:none;z-index:9
  }
  #toast.on{opacity:1;transform:none}
  #toast.ok{background:#12351f;color:#8ef0b0;border:1px solid #1f6b3d}
  #toast.bad{background:#3a1616;color:#ffb0b0;border:1px solid #7a2626}
  #toast.wait{background:#20202c;color:#c9c6bd;border:1px solid #33333f}

  footer{flex:0 0 auto;text-align:center;font-size:10px;letter-spacing:.14em;color:#4e4c46;
         text-transform:uppercase;padding:0 0 10px}
  a.switch{color:#4e4c46;text-decoration:none;border-bottom:1px dotted #3a3833}
</style>
</head>
<body>

<header>
  <div class="crown">👑</div>
  <div class="brand">Royal Diamond</div>
  <div class="who" id="who">—</div>
  <div class="whosub" id="whosub"></div>
</header>

<main id="main"></main>

<footer id="foot"></footer>
<div id="toast"></div>

<script>
(function(){
  "use strict";

  var ENDPOINT = "https://rd-buttons.royaldiamond.workers.dev/p";
  var KEY      = "H94F1ny7BJOTIbISXtLAp6AnHNLnN7W8MCHLI1GG";

  var PEOPLE = [
    {id:"helen",  name:"Helen"},
    {id:"hannah", name:"Hannah"},
    {id:"lissa",  name:"Lissa"}
  ];

  var ACTIONS = [
    {g:"single", ico:"💅", tr:"Manikür başlat",   en:"START MANICURE"},
    {g:"double", ico:"🦶", tr:"Pedikür başlat",   en:"START PEDICURE"},
    {g:"triple", ico:"👁", tr:"Kirpik başlat",    en:"START EYELASHES"},
    {g:"long",   ico:"✅", tr:"İşi bitir",        en:"FINISH THE JOB", cls:"finish"}
  ];

  var main  = document.getElementById("main");
  var toast = document.getElementById("toast");
  var busy  = false;

  function say(kind, msg, ms){
    toast.className = kind + " on";
    toast.textContent = msg;
    clearTimeout(say._t);
    say._t = setTimeout(function(){ toast.className = ""; }, ms || 2200);
  }

  function buzz(pattern){
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
  }

  function person(){
    var q = (location.search.match(/[?&]who=([a-z]+)/i) || [])[1];
    if (q) q = q.toLowerCase();
    if (!q) { try { q = localStorage.getItem("rd_who") || ""; } catch(e){} }
    for (var i=0;i<PEOPLE.length;i++) if (PEOPLE[i].id === q) return PEOPLE[i];
    return null;
  }

  function remember(id){ try { localStorage.setItem("rd_who", id); } catch(e){} }

  function send(who, g, btn){
    if (busy) return;
    busy = true;
    var all = main.querySelectorAll("button");
    for (var i=0;i<all.length;i++) all[i].disabled = true;
    say("wait", "Gönderiliyor…", 6000);

    var url = ENDPOINT + "?k=" + encodeURIComponent(KEY)
            + "&who=" + encodeURIComponent(who)
            + "&g="   + encodeURIComponent(g)
            + "&src=phone&t=" + Date.now();

    var done = false;
    var ctl  = ("AbortController" in window) ? new AbortController() : null;
    var kill = setTimeout(function(){ if (ctl) try{ctl.abort();}catch(e){} }, 9000);

    function finish(ok, msg){
      if (done) return; done = true;
      clearTimeout(kill);
      busy = false;
      for (var i=0;i<all.length;i++) all[i].disabled = false;
      if (ok) { buzz(35); say("ok", msg); }
      else    { buzz([40,60,40]); say("bad", msg, 4200); }
    }

    fetch(url, {cache:"no-store", signal: ctl ? ctl.signal : undefined})
      .then(function(r){ return r.text().then(function(t){ return {s:r.status, t:(t||"").trim()}; }); })
      .then(function(res){
        if (res.s === 200 && res.t === "ok")        finish(true,  "Gönderildi 👑");
        else if (res.s === 200 && res.t === "ignored") finish(true, "Zaten kayıtlı 👑");
        else if (res.s === 403)                     finish(false, "Anahtar reddedildi — Bülent'e söyle");
        else if (res.s === 400)                     finish(false, "İsim tanınmadı — Bülent'e söyle");
        else                                        finish(false, "Gitmedi (" + res.s + ") — tekrar bas");
      })
      .catch(function(){
        finish(false, "İnternet yok — tekrar bas");
      });
  }

  function drawActions(p){
    document.getElementById("who").textContent = p.name;
    document.getElementById("whosub").textContent = "bu telefon " + p.name + " için";
    main.innerHTML = "";
    ACTIONS.forEach(function(a){
      var b = document.createElement("button");
      b.className = "act" + (a.cls ? " " + a.cls : "");
      b.innerHTML = '<span class="ico">' + a.ico + '</span>'
                  + '<span class="lbl">' + a.tr + '<span class="en">' + a.en + '</span></span>';
      b.addEventListener("click", function(){ send(p.id, a.g, b); });
      main.appendChild(b);
    });
    document.getElementById("foot").innerHTML =
      'Basmazsan 👑 yok — 👑 yoksa prim yok &nbsp;·&nbsp; <a class="switch" href="?who=">kişi değiştir</a>';
  }

  function drawPicker(){
    document.getElementById("who").textContent = "Kim?";
    document.getElementById("whosub").textContent = "bir kez seç, telefon hatırlar";
    main.innerHTML = '<div class="pick"><div class="pickhead">Bu telefon kimin?</div></div>';
    var box = main.firstChild;
    PEOPLE.forEach(function(p){
      var b = document.createElement("button");
      b.textContent = p.name;
      b.addEventListener("click", function(){ remember(p.id); drawActions(p); });
      box.appendChild(b);
    });
    document.getElementById("foot").textContent = "Royal Diamond Nail & Beauty";
  }

  var p = person();
  if (p) { remember(p.id); drawActions(p); } else { drawPicker(); }
})();
</script>
</body>
</html>
