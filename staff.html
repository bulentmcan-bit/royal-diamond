<style>
:root{--gold:#c9a05a;--goldD:#8a6420;--dark:#141614;--card:#fff;--bg:#f7f5f2;--wa:#25D366;--ok:#2e9e5b;--bad:#c0392b;--text:#1f1f1f;--muted:#777;--line:#e3ded4;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
.hero{background:linear-gradient(135deg,#141614,#2a2f28);color:#fff;text-align:center;padding:calc(26px + env(safe-area-inset-top)) 16px 20px;}
.hero h1{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.35rem;}
.hero p{color:#cfcabc;font-size:0.8rem;margin-top:5px;}
.wrap{max-width:520px;margin:-12px auto 32px;padding:0 13px;}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.07);padding:17px 15px;margin-bottom:14px;}
.lbl{font-size:.7rem;font-weight:800;letter-spacing:1px;color:var(--goldD);text-transform:uppercase;margin:12px 0 8px;}
.lbl:first-child{margin-top:0;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{flex:1 1 92px;min-height:52px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--text);cursor:pointer;line-height:1.25;}
.chip.on{border-color:var(--gold);background:#fdf6e9;}
.chip:disabled{opacity:.42;cursor:not-allowed;}
.slot{flex:1 1 72px;min-height:50px;font-variant-numeric:tabular-nums;}
.slot.busy{background:#f3eeea;border-color:#e0d6cc;color:#9a8e85;}
.slot.busy small{display:block;font-size:.6rem;font-weight:800;letter-spacing:.05em;color:#b4645a;}
.slot.free small{display:block;font-size:.6rem;font-weight:800;letter-spacing:.05em;color:var(--ok);}
.grid{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;}
.grid table{border-collapse:collapse;width:100%;font-size:.8rem;}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;}
.grid th:last-child,.grid td:last-child{border-right:0;}
.grid thead th{background:#faf7f2;color:var(--goldD);font-weight:800;font-size:.74rem;padding:8px 4px;position:sticky;top:0;}
.grid tbody th{background:#faf7f2;font-weight:800;font-variant-numeric:tabular-nums;padding:0 8px;white-space:nowrap;position:sticky;left:0;z-index:1;}
.cell{display:block;width:100%;min-width:62px;min-height:42px;border:0;background:none;font-family:inherit;font-size:.68rem;font-weight:800;letter-spacing:.04em;cursor:pointer;color:var(--ok);}
.cell.busy{background:#f3eeea;color:#b4645a;cursor:not-allowed;}
.cell.off{background:#f7f7f7;color:#c8c8c8;cursor:not-allowed;}
.cell.on{background:var(--gold);color:#fff;}
.pickline{margin-top:9px;font-size:.84rem;font-weight:700;color:var(--goldD);min-height:20px;}
input,select{width:100%;padding:13px 12px;border:2px solid var(--line);border-radius:12px;font-family:inherit;font-size:16px;background:#fff;color:var(--text);}
.go{width:100%;margin-top:16px;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#c9a05a,#8a6420);color:#fff;font-family:inherit;font-size:1.02rem;font-weight:800;cursor:pointer;}
.go:disabled{opacity:.55;}
.note{font-size:.76rem;color:var(--muted);margin-top:9px;line-height:1.5;}
.conn{text-align:center;font-size:.75rem;color:var(--muted);padding:7px 0 2px;}
.done{display:none;text-align:center;padding:10px 4px;}
.done h2{font-family:'Playfair Display',serif;color:var(--goldD);font-size:1.2rem;margin-bottom:10px;}
.sum{background:#fdf6e9;border:1px solid #efe0c4;border-radius:12px;padding:13px;font-size:.92rem;line-height:1.7;margin:10px 0;text-align:left;}
.again{display:inline-block;margin-top:6px;padding:12px 20px;border:2px solid var(--gold);border-radius:12px;background:#fff;color:var(--goldD);font-weight:800;font-family:inherit;font-size:.9rem;cursor:pointer;}
.bad{background:#fdecea;border:1px solid #f5c6c0;color:#8e2f23;border-radius:12px;padding:13px;font-size:.86rem;line-height:1.55;}
</style></head>
<body>
<div class="hero"><h1 id="hd">👑 Randevu Defterim</h1><p id="sub">Royal Diamond Nail &amp; Beauty</p></div>
<div class="wrap">
  <div class="conn" id="conn">Bağlanıyor…</div>
  <div class="card" id="form">
    <div class="lbl">📅 Gün</div><div class="chips" id="days"></div>
    <div class="lbl">👩 Personel ve saat <span id="gridhint" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);"></span></div>
    <div id="grid" class="grid"></div>
    <div class="lbl">💅 Hizmet</div><select id="svc"></select>
    <div class="lbl">🙋‍♀️ Müşteri</div>
    <input id="nm" placeholder="Adı Soyadı" autocomplete="off">
    <div style="height:9px"></div>
    <input id="ph" placeholder="05XX XXX XX XX" inputmode="tel" autocomplete="off">
    <button class="go" id="go">✅ Randevuyu Yaz</button>
    <div class="note" id="foot"></div>
  </div>
  <div class="card done" id="done">
    <h2>✅ Randevu yazıldı</h2>
    <div class="sum" id="sum"></div>
    <button class="again" id="again">+ Bir randevu daha</button>
  </div>
</div>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   A technician's own page — her days, her hours, her bookings.

   WHO IT IS FOR. Beyhan is in on her own days, on commission, with her own
   customers, and she has no reason to see the salon's books. index.html has
   exactly two roles, owner and reception, and both of them see Daily Takings,
   salaries, the P&L and every customer's telephone number. Handing her that
   login to let her write her own appointments would be trading the whole
   ledger for a diary.

   SO THIS PAGE HAS NO LOGIN AT ALL. It signs in anonymously, exactly as
   booking.html does, and it reads ONE world-readable thing: the availability
   feed the salon already publishes (rdns_public_availability), which carries
   free/busy per technician per half hour and NO customer data whatsoever. She
   therefore sees her day as open or taken, never who is coming — and nothing
   new is published anywhere to make this page work. Customer names stay inside
   the salon. That was a deliberate choice, not an oversight.

   WRITING. She pushes to rdns_booking_requests like the customer page, with
   one extra field: tech. The salon app picks it up within seconds and writes
   the appointment. index.html honours that field or REFUSES — it never hands
   her customer to whoever happens to be free, because a customer who asked for
   Beyhan and finds somebody else is worse served than one who is rung back.

   The salon app must be open on a machine for the request to be turned into an
   appointment. That is already true of every online booking.

   ?who=<key> names the technician, and the key must exist in crown-config.js.
   Nothing about this file is particular to Beyhan: a second technician needs a
   link, not a copy of this page.
   ═══════════════════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDHSIhzTf-zpOwh9ELe3DzpfHrxAffnz2k",
  authDomain:"royal-diamond-1031c.firebaseapp.com",
  databaseURL:"https://royal-diamond-1031c-default-rtdb.firebaseio.com",
  projectId:"royal-diamond-1031c",
  storageBucket:"royal-diamond-1031c.firebasestorage.app",
  messagingSenderId:"440737939833",
  appId:"1:440737939833:web:56d697cb2d6d4baa992fa8"
};
var SALON='905488933333';
var GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
var AY=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
var DAYS_AHEAD=28;

// ── who ────────────────────────────────────────────────────────────────────
// The key comes off the address and is checked against crown-config. An
// unknown one shows a refusal rather than a page that silently books nobody.
/* WHOSE diary this is, and why it is remembered.

   It came off the address alone, and the first thing that happened when Beyhan
   put the page on her iPhone home screen was that it stopped working: a saved
   web app opens the address in the MANIFEST, and that manifest said
   /staff.html with no ?who= on the end. She got "Bu bağlantı eksik" and an
   empty page. The manifest is gone now — with none, iOS bookmarks the exact
   address she is standing on, query string and all — and on top of that the
   answer is remembered here, so a link that loses its tail on the way through
   WhatsApp, a bookmark made the old way, or a home screen icon saved before
   today all still open her own diary.

   The address still wins when it carries a name, so one phone can be handed
   to a different technician with a different link and is not stuck with
   whoever opened it first. ?who=0 forgets her again. */
var SF_MEM='rd_staff_who_v1';
function sfRemember(k){ try{ if(k) localStorage.setItem(SF_MEM,k); else localStorage.removeItem(SF_MEM); }catch(e){} }
function sfRecall(){ try{ return localStorage.getItem(SF_MEM)||''; }catch(e){ return ''; } }
function sfWho(){
  var m=/[?&]who=([^&#]+)/.exec(location.search||'');
  var k=m?decodeURIComponent(m[1]).trim().toLowerCase():'';
  if(k==='0'){ sfRemember(''); k=''; }
  var fromUrl=!!k;
  if(!k) k=sfRecall();
  try{
    var o=k&&window.CROWN&&CROWN.find?CROWN.find(k):null;
    if(o&&fromUrl) sfRemember(o.key);
    if(!o&&!fromUrl) sfRemember('');   // a remembered name the config no longer knows
    return o||null;
  }catch(e){ return null; }
}
var ME=sfWho();

// ── the days she is actually in ────────────────────────────────────────────
// rosterOn answers it, so her workdays live in crown-config and nowhere else:
// change [2,4] there and this page follows without being touched.
function sfKey(d){ var p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function sfClosed(d){ try{ return !!(window.CROWN&&CROWN.isClosedDay&&CROWN.isClosedDay(d)); }catch(e){ return d.getDay()===0; } }
function sfOnDuty(d){
  if(!ME) return false;
  try{ return (CROWN.rosterOn(sfKey(d))||[]).some(function(o){ return o.key===ME.key; }); }catch(e){ return false; }
}
function sfMyDays(from, n){
  var out=[], d0=new Date(from);
  for(var i=0;i<(n||DAYS_AHEAD);i++){
    var d=new Date(d0); d.setDate(d0.getDate()+i);
    if(!sfClosed(d) && sfOnDuty(d)) out.push(d);
  }
  return out;
}
/* EVERY open day, not only hers. She books for the whole salon now, so the
   day list is the salon's week and not her own two days. A day the salon is
   shut is left out; a day she is not in is not, because she can still take a
   booking for Helen on a Wednesday. */
function sfOpenDays(from, n){
  var out=[], d0=new Date(from);
  for(var i=0;i<(n||DAYS_AHEAD);i++){
    var d=new Date(d0); d.setDate(d0.getDate()+i);
    if(!sfClosed(d)) out.push(d);
  }
  return out;
}
/* WHO is in on a given day — the same answer reception's own grid gives.
   rosterOn minus hiddenOnDash: Zara is rostered on Mondays and Thursdays and
   is deliberately off reception's columns, so she is off these too. One screen
   showing a technician the desk's own screen does not would be two different
   stories about the same day, and the desk's is the one the salon runs on. */
function sfTechsOn(ymd){
  try{
    // A closed day has nobody in it, whatever the roster says: rosterOn
    // answers "who works this weekday", not "is the salon open".
    if(sfClosed(new Date(String(ymd)+'T12:00:00'))) return [];
    return (CROWN.rosterOn(ymd)||[]).filter(function(o){ return !o.hiddenOnDash; });
  }catch(e){ return []; }
}
/* ── her services ──────────────────────────────────────────────────────────
   Her OWN list wins. An operator in crown-config.js may carry
   `services: {name: minutes}` (or a plain array of names), and where she does,
   that IS the list — exactly what she renders, in the order the owner wrote
   it, including treatments the salon's generic menu has no line for. One map,
   one place, and no copy of it in this file.

   With no such list the fallback is the skill groups, but STRICTLY: the
   service must land in a group AND canDo must allow her. canDo on its own is
   too generous here — it answers "is she forbidden?", and a service it cannot
   categorise at all (Güzellik Uygulaması) comes back open to everybody. Right
   for the salon's diary, where an unclassified job should not be blocked;
   wrong for a page whose whole purpose is to offer her what she does. */
function sfServicesOf(op, all){
  if(!op) return [];
  var mine=op.services;
  if(Array.isArray(mine)) return mine.slice();
  if(mine && typeof mine==='object') return Object.keys(mine);
  return (all||[]).filter(function(s){
    try{ return !!CROWN.serviceGroup(s) && !!CROWN.canDo(op.key, s); }catch(e){ return false; }
  });
}
// Kept for the page's own default view: whoever the link belongs to.
function sfMyServices(all){ return sfServicesOf(ME, all); }
var ALL_SERVICES=['Klasik Manikür','Jel Başlangıç (Full Set)','Dolgu (Infill)','Nail Art','French / Ombre','Tırnak Onarımı','Tırnak Çıkarma','Klasik Pedikür (Ojesiz)','Jel Pedikür','Lüks Spa Pedikür','Medikal Pedikür','Renk Değişimi (Pedikür)','Klasik Kirpik Uygulaması','Volume / Rus Kirpiği','Kirpik Dolgu','Kirpik Lifting & Boyama','Kirpik Çıkarma','Altın Oran Kaş Alımı','Kaş Boyama','Kaş Laminasyon','Microblading','Bıyık / Çene Ağda','Tüm Yüz Ağda','Koltuk Altı Ağda','Yarım Bacak Ağda','Tam Bacak Ağda','Bikini Ağda','Özel Bölge Ağda','Tüm Vücut Ağda','Tam Kol Ağda','Güzellik Uygulaması'];

// ── free or taken, for HER ─────────────────────────────────────────────────
// The feed's per-technician flags: a=1 she can start a whole job here, t=1 she
// is busy. No name, no service, no telephone — this feed carries none.
// Anything the feed does not answer is 'unknown', drawn as bookable and said
// to be unconfirmed, because refusing a booking on missing data would lose her
// a customer over a slow connection.
/* WHICH NAME the feed uses for her. index.html publishes these maps keyed by
   the technician's DISPLAY name — "Beyhan", "Helen" — while everything in
   crown-config is keyed by the lower-case key. Reading a[key] found nothing
   and every hour of her day came back 'unknown', which drew as bookable with
   no BOŞ or DOLU on it: the page looked like it was working and was telling
   her nothing. So the lookup accepts either, case-insensitively, and the
   caller passes the operator rather than one of her two names. */
function sfPick(map, me){
  if(!map || !me) return undefined;
  var want=[String(me.key||'').toLowerCase(), String(me.name||'').toLowerCase()];
  var hit;
  Object.keys(map).forEach(function(k){
    if(typeof hit==='undefined' && want.indexOf(String(k).toLowerCase())!==-1) hit=map[k];
  });
  return hit;
}
function sfSlotState(avail, ymd, slot, me){
  var day=avail&&avail.days&&avail.days[ymd];
  if(!day||day._closed) return day&&day._closed?'closed':'unknown';
  var s=day[slot];
  if(!s||typeof s!=='object') return 'unknown';
  var a=sfPick(s.a, me); if(typeof a!=='undefined') return a?'free':'busy';
  var t=sfPick(s.t, me); if(typeof t!=='undefined') return t?'busy':'free';
  return 'unknown';
}
function sfSlots(){
  try{ if(window.CROWN&&CROWN.startLadderHM) return CROWN.startLadderHM(); }catch(e){}
  var a=[]; for(var m=8*60;m<=18*60;m+=30){ if(m%60===0||m>=17*60+30) a.push(('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2)); }
  return a;
}
// What gets pushed. tech is the whole point of it.
/* `me` is the technician the booking is FOR; `by` is whose page it came from.
   They are the same when she books herself and different when she takes a
   customer for Helen, and the salon should be able to tell which — `src` says
   who typed it, `tech` says who does the work. */
function sfRequest(me, day, time, service, name, phone, now, by){
  var r={ name:String(name||'').trim(), phone:String(phone||'').trim(),
          date:sfKey(day), time:time, service:service,
          tech:me.key, ts:Number(now)||Date.now(), src:'staff-'+((by&&by.key)||me.key) };
  // How long it takes, where crown-config says. The salon app works it out
  // again at its end from the same config, so this is a courtesy for the
  // confirmation line and for anyone reading the request — never the
  // authority. Left off entirely when there is no figure, rather than sent
  // as a 0 that something downstream might believe.
  var m=sfMinsOf(service, me);
  if(m) r.mins=m;
  return r;
}
function sfPhoneOk(p){ return String(p||'').replace(/\D/g,'').length>=10; }
// How long this job of hers takes, for the list and the confirmation line.
// null where crown-config has no figure — the page then says nothing rather
// than putting a guessed length in front of her.
function sfMinsOf(service, op){
  var who=op||ME;
  try{ return who?CROWN.serviceMinutes(who.key, service):null; }catch(e){ return null; }
}

if(typeof module!=='undefined'&&module.exports){
  module.exports={sfKey:sfKey,sfSlotState:sfSlotState,sfPick:sfPick,sfRequest:sfRequest,sfPhoneOk:sfPhoneOk};
}
</script>
<script>
(function(){
  var db=null, ready=false, avail=null, selDay=null, selTime=null, selTech=null;
  var dEl=document.getElementById('days'), gEl=document.getElementById('grid'),
      hintEl=document.getElementById('gridhint'),
      sEl=document.getElementById('svc'), cEl=document.getElementById('conn'),
      fEl=document.getElementById('foot');

  if(!ME){
    document.getElementById('form').innerHTML='<div class="bad"><b>Bu bağlantı eksik.</b><br>Adresin sonunda kimin defteri olduğu yazmalı, örneğin <code>?who=beyhan</code>. Lütfen Bülent’den doğru bağlantıyı isteyin.</div>';
    cEl.style.display='none';
    document.getElementById('hd').textContent='👑 Randevu Defteri';
    return;
  }
  document.getElementById('hd').textContent='👑 '+ME.name;
  document.getElementById('sub').textContent='Royal Diamond — salonun randevu defteri';
  fEl.innerHTML='Herkes için randevu yazabilirsiniz. Randevu, seçtiğiniz personelin adına salonun defterine geçer. Saat doluysa ya da o personel o gün çalışmıyorsa kaydedilmez — resepsiyon arar. <b>Para ekranları bu sayfada yoktur.</b>';

  /* THE WHOLE SALON'S DAY. She books for everyone now, so the day list is
     every open day and the picture is a grid: an hour down the side, a
     technician across the top, each cell BOŞ or DOLU for THAT woman at THAT
     hour. One tap chooses the pair. */
  function drawDays(){
    var ds=sfOpenDays(new Date(), DAYS_AHEAD);
    if(!ds.length){ dEl.innerHTML='<div class="note">Önümüzdeki '+DAYS_AHEAD+' günde açık gün yok.</div>'; return; }
    dEl.innerHTML=ds.map(function(d,i){
      var on=selDay&&sfKey(selDay)===sfKey(d);
      var mine=sfOnDuty(d);
      return '<button type="button" class="chip'+(on?' on':'')+'" data-i="'+i+'">'+GUN[d.getDay()]
        +'<br><b>'+d.getDate()+' '+AY[d.getMonth()]+'</b>'
        +(mine?'<br><span style="font-size:.6rem;font-weight:800;letter-spacing:.05em;color:var(--goldD);">SİZ</span>':'')
        +'</button>';
    }).join('');
    [].forEach.call(dEl.children,function(b){
      if(!b.dataset) return;
      b.onclick=function(){ selDay=ds[+b.dataset.i]; selTime=null; selTech=null; drawDays(); drawGrid(); };
    });
  }

  function drawGrid(){
    if(!selDay){ gEl.innerHTML='<div class="note" style="padding:12px;">Önce bir gün seçin.</div>'; hintEl.textContent=''; drawSvc(); return; }
    var ymd=sfKey(selDay), techs=sfTechsOn(ymd);
    if(!techs.length){ gEl.innerHTML='<div class="note" style="padding:12px;">O gün çalışan görünmüyor.</div>'; hintEl.textContent=''; drawSvc(); return; }
    hintEl.textContent='— boş bir kutuya dokunun';
    var h='<table><thead><tr><th></th>'+techs.map(function(o){
      return '<th'+(ME&&o.key===ME.key?' style="color:var(--gold);"':'')+'>'+o.name+'</th>';
    }).join('')+'</tr></thead><tbody>';
    sfSlots().forEach(function(t){
      h+='<tr><th>'+t+'</th>';
      techs.forEach(function(o,ti){
        var st=sfSlotState(avail, ymd, t, o);
        var busy=(st==='busy');
        var on=(selTime===t && selTech && selTech.key===o.key);
        h+='<td><button type="button" class="cell'+(busy?' busy':'')+(on?' on':'')+'" data-t="'+t+'" data-i="'+ti+'"'
          +(busy?' disabled':'')+'>'+(busy?'DOLU':(st==='free'?'BOŞ':'·'))+'</button></td>';
      });
      h+='</tr>';
    });
    gEl.innerHTML=h+'</tbody></table><div class="pickline" id="pick"></div>';
    [].forEach.call(gEl.querySelectorAll('button.cell'),function(b){
      b.onclick=function(){
        selTime=b.dataset.t; selTech=techs[+b.dataset.i];
        drawGrid(); drawSvc();
      };
    });
    var pk=document.getElementById('pick');
    if(pk) pk.textContent = (selTech&&selTime) ? ('Seçilen: '+selTech.name+' · '+selTime) : '';
  }

  /* The service list follows WHOSE column was tapped: Beyhan's eight when it
     is hers, Helen's when it is Helen's. A technician is never offered a
     service she does not do, so a customer cannot be written into a column
     where nobody can serve her. */
  function drawSvc(){
    var who=selTech||ME;
    var list=sfServicesOf(who, ALL_SERVICES);
    sEl.innerHTML=list.map(function(x){
      var m=sfMinsOf(x, who);
      return '<option value="'+x.replace(/"/g,'&quot;')+'">'+x+(m?' · '+m+' dk':'')+'</option>';
    }).join('') || '<option value="">(hizmet yok)</option>';
  }

  drawDays(); drawGrid(); drawSvc();

  try{
    var app=firebase.initializeApp(FIREBASE_CONFIG,'staffPage');
    db=app.database();
    app.auth().setPersistence(firebase.auth.Auth.Persistence.NONE)
      .then(function(){ return app.auth().signInAnonymously(); })
      .then(function(){
        ready=true;
        db.ref('rdns_public_availability/days').on('value',function(snap){
          avail={days:snap.val()||{}};
          cEl.innerHTML=snap.val()?'🟢 Canlı müsaitlik':'Müsaitlik bilgisi yok — yine de yazabilirsiniz';
          drawGrid();
        });
      })
      .catch(function(e){ console.warn(e); cEl.innerHTML='Bağlantı kurulamadı — WhatsApp ile yazın'; });
  }catch(e){ console.warn(e); cEl.innerHTML='Bağlantı kurulamadı — WhatsApp ile yazın'; }

  function waFallback(req){
    var msg='👑 RANDEVU — '+((selTech&&selTech.name)||ME.name)+'\n\n📅 '+req.date+'\n🕐 '+req.time+'\n💅 '+req.service+'\n🙋‍♀️ '+req.name+'\n📞 '+req.phone;
    location.href='https://wa.me/'+SALON+'?text='+encodeURIComponent(msg);
  }
  document.getElementById('go').onclick=function(){
    var nm=document.getElementById('nm').value, ph=document.getElementById('ph').value;
    if(!selDay){ alert('Lütfen bir gün seçin.'); return; }
    if(!selTime||!selTech){ alert('Lütfen personel ve saat seçin — tablodan boş bir kutuya dokunun.'); return; }
    if(!String(nm).trim()){ alert('Müşterinin adını yazın.'); return; }
    if(!sfPhoneOk(ph)){ alert('Geçerli bir telefon yazın (05XX XXX XX XX).'); return; }
    if(!sEl.value){ alert('Bu personel için hizmet listesi boş.'); return; }
    if(sfSlotState(avail, sfKey(selDay), selTime, selTech)==='busy'){ alert('Bu saat az önce doldu, başka bir kutu seçin.'); selTime=null; selTech=null; drawGrid(); return; }
    // FOR selTech, BY ME — the two are the same when she books herself.
    var req=sfRequest(selTech, selDay, selTime, sEl.value, nm, ph, Date.now(), ME);
    var b=this; b.disabled=true; b.textContent='Kaydediliyor…';
    if(!ready||!db){ waFallback(req); return; }
    db.ref('rdns_booking_requests').push(req).then(function(){
      document.getElementById('form').style.display='none';
      var d=document.getElementById('done'); d.style.display='block';
      document.getElementById('sum').innerHTML='📅 <b>'+GUN[selDay.getDay()]+', '+selDay.getDate()+' '+AY[selDay.getMonth()]+'</b><br>🕐 <b>'+selTime+'</b><br>💅 '+req.service+'<br>🙋‍♀️ '+req.name+'<br>📞 '+req.phone+'<br>👩 '+selTech.name+(sfMinsOf(req.service, selTech)?'<br>⏱ '+sfMinsOf(req.service, selTech)+' dakika':'');
      window.scrollTo({top:0,behavior:'smooth'});
    }).catch(function(e){ console.warn(e); b.disabled=false; b.textContent='✅ Randevuyu Yaz'; waFallback(req); });
  };
  document.getElementById('again').onclick=function(){
    document.getElementById('done').style.display='none';
    var f=document.getElementById('form'); f.style.display='block';
    document.getElementById('nm').value=''; document.getElementById('ph').value='';
    selTime=null; selTech=null; drawGrid(); drawSvc();
    var g=document.getElementById('go'); g.disabled=false; g.textContent='✅ Randevuyu Yaz';
  };
})();
</script>
</body></html>
