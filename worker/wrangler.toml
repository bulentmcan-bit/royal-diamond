# The relay between the wall buttons and Firebase. See README.md — deploying it
# is `wrangler deploy` from this folder, and the two secrets are set once with
# `wrangler secret put` and never written down here.
name = "rd-buttons"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# The morning reminders. Cloudflare cron speaks only UTC, and 06:00 at the
# salon is not one UTC hour: Northern Cyprus moved back to seasonal clocks in
# 2017, so six in the morning is 03:00 UTC in summer and 04:00 UTC in winter.
# Both hours are scheduled, and the worker itself asks what time it is in
# Asia/Nicosia — the firing that is not 06:00 there leaves without doing
# anything. Exactly one of the two can be six o'clock on any given day, the
# clock-change Sundays included, so a reminder can never go out twice.
#
# The third line is the automatic gap-filler: every hour, 09:00–18:00 at the
# salon, Monday to Saturday. 06:00–16:00 UTC covers that range in both
# seasons (09:00 salon is 06:00Z in summer and 07:00Z in winter; 18:00 salon
# is 15:00Z / 16:00Z), and the worker again asks the salon clock — a firing
# that lands on 08:00 or 20:00 there leaves without doing anything. Its
# rules and switches (dry run, cap, kill switch) live in crown-config.js
# `gapFill`, bundled into the worker at deploy — see the note there.
#
# The same line's LAST tick is the automatic Google review request
# (runReviewAsk), which runs once at reviewAsk.sendHourLocal — 19:00 at the
# salon, the evening of the visit. 19:00 there is 16:00Z in summer and
# 17:00Z in winter, so the line runs to 17 (it was 6-16 until 15 Eylül
# 2026); the extra summer firing at 20:00 salon time leaves quietly, like
# the others. Its switches live in crown-config.js `reviewAsk`.
#
# THE NIGHTLY BACKUP rides on the first two lines — the only two that fire
# EVERY day, Sunday included. Whichever of them lands before 08:00 at the
# salon (05:00, 06:00 or 07:00 there, depending on the season) takes one
# snapshot of the whole tree into Cloudflare KV; the second finds it done
# and leaves. No new cron was added on purpose: these two already run 365
# days a year, and a backup must not be the thing that needs a new schedule
# to keep working. See runBackup in src/index.js.
[triggers]
crons = ["0 3 * * *", "0 4 * * *", "0 6-17 * * 1-6"]

# The confirm-page store. Each key holds ONE appointment's public face — date,
# time, service, and the customer's answer — and nothing else: no name, no
# phone, no price. The armed app pushes records here behind the shared key;
# the /r/ page reads them; answers travel back to the app by polling ONE
# index document (idx:answers) — never a KV list, which the free tier caps
# at 1,000/day and every open tab's once-a-minute poll would burn through
# before lunch. The nightly cron rebuilds the index from the per-answer keys
# (the worker's single daily list). No Firebase credential ever sits here.
[[kv_namespaces]]
binding = "RD_WA"
id = "087711ff20264efe9e6aadfacaf945e1"

# The reminders' master switch. "off" means the six-o'clock firing only writes
# a log line; nothing is read as a batch, nothing is sent. Turning it on is a
# one-word edit here plus a deploy — deliberate and visible in git, never an
# accident. The gateway credentials and the database secret are wrangler
# secrets (SMSGATE_LOGIN, SMSGATE_PASSWORD, FB_SECRET), never in this file.
[vars]
SMS_REMINDERS = "off"

# When the salon opens, HH:MM on the salon's own clock. The 2-hour WhatsApp
# goes ONLY to appointments whose one-hour call moment falls before reception
# is at the desk (this time minus ten minutes) — with 08:00 that means the
# 08:00 and 08:30 starts and nobody else, because everyone else gets the
# 1 SAAT KALA phone call instead. Change the opening here and the line moves
# with it. Keep in step with CROWN.openTime in crown-config.js.
WA_OPEN = "08:00"

# The two WhatsApp reminder templates, sent through Piyzi (routes under /wa/).
# Empty means "not configured yet": /wa/schedule refuses with
# TEMPLATES_NOT_CONFIGURED instead of sending under a guessed name that would
# fail silently at Piyzi's end. To fill them in, call GET /wa/templates (see
# README) and copy each template's REAL name and variable order from its
# examplePayload. The value is one JSON object per template:
#
#   WA_R24 = '{"templateName":"<name from /wa/templates>","languageCode":"tr","body":["{name}","{when}"]}'
#
# Placeholders the worker substitutes per appointment: {name} {service}
# {date} (YYYY-MM-DD) {dateLong} ("2 Eylül Çarşamba") {time} (HH:MM)
# {when} ("1 Eylül 14:00", salon clock).
# header/body arrays must match the template's variableCounts exactly —
# Piyzi rejects a mismatch. The Piyzi key itself is NEVER here: it is the
# wrangler secret PIYZI_API_KEY, set by the owner.
# Filled 29 Aug 2026 from the live GET /wa/templates response. Both approved
# templates carry ONE body variable (the appointment hour) and ONE dynamic URL
# button whose link is this worker's own /r/{{1}} page — the button value is
# the apptId, so the customer's "Detaylar / Details" tap lands somewhere real.
WA_R24 = '{"templateName":"pyz_randevu_hatirlatma_24saat","languageCode":"tr","body":["{time}"],"buttons":{"0":"{apptId}"}}'
WA_R1 = '{"templateName":"pyz_randevu_hatirlatma_2saat","languageCode":"tr","body":["{time}"],"buttons":{"0":"{apptId}"}}'
#
# WAITING ON META. Neither of these two stock Piyzi templates ever asks the
# customer to answer — their only button is a "Detaylar / Details" link — which
# is why twenty-five reminders went out and twenty-five customers said nothing.
# templates/reminder-confirm.md is the replacement: the same reminder with two
# quick-reply buttons, "Geleceğim / Yes" and "Gelemiyorum / No", whose
# labels the dashboard's own rdWrIsConfirm/rdWrIsCancel already read. SUBMITTED
# to Meta 2 Ekim 2026 as `randevu_onay` (id 856231290849449), PENDING. Once it
# is APPROVED, check the variable order against GET /wa/templates, then replace
# BOTH lines above with these and deploy:
#
#   WA_R24 = '{"templateName":"randevu_onay","languageCode":"tr","body":["{dateLong}","{time}"]}'
#   WA_R1  = '{"templateName":"randevu_onay","languageCode":"tr","body":["{dateLong}","{time}"]}'
#
# Not before. A reminder that fails to send is worse than one nobody answers.
#
# RESUBMITTED 5 Ekim 2026 as `randevu_onay2` (the first name could not be
# reused); APPROVED 6 Ekim (Piyzi's picker had hidden it). Any approved
# template whose name starts with `randevu_onay` (namePrefix) now counts, so
# a resubmission as randevu_onay3 needs no edit here. No edit is needed
# when Meta approves it either: the worker asks
# Piyzi's approved-template list (cached an hour) on each /wa/schedule and,
# once randevu_onay2 is listed, sends the near reminder (WA_CONFIRM_MIN
# before) under the spec below instead of WA_R1, falling back to it if Piyzi
# refuses it. The day-before reminder stays WA_R24, a plain heads-up.
# 6 Ekim: Bülent wanted a green tick and a red X. Meta refuses emoji on
# buttons, so randevu_onay4 carries ✅/❌ lines in the BODY above the same
# two plain buttons. It is named first so it wins once approved; until then
# the highest approved randevu_onay* (randevu_onay2) keeps sending.
# Empty this line to switch the automatic change off.
WA_CONFIRM = '{"templateName":"randevu_onay4","namePrefix":"randevu_onay","languageCode":"tr","body":["{dateLong}","{time}"]}'
# Once it is live, every customer also gets it this many minutes before the
# appointment (not only the early ones), so the answer is fresh. 90 leaves
# half an hour to tap before reception's 1 SAAT KALA call for the silent ones.
WA_CONFIRM_MIN = "90"

# The booking confirmation, sent the MOMENT a booking is made (no scheduledAt)
# via POST /wa/confirm-booking. pyz_appointment_booked_v2 carries two body
# variables: {{1}} the Turkish long date and {{2}} the hour. Same contract as
# above: an empty or broken value makes the route refuse with
# TEMPLATES_NOT_CONFIGURED instead of sending under a guessed shape.
WA_CONF = '{"templateName":"pyz_appointment_booked_v2","languageCode":"tr","body":["{dateLong}","{time}"]}'

# The gap-filler's offer — the MARKETING template in templates/gapfill-offer.md,
# no name and no variables, sent by the hourly cron (runGapFiller). Meta
# approved it 14 Eylül 2026 and GET /wa/templates returns it under exactly
# this name (no pyz_ prefix), language tr, variableCount 0, no buttons,
# sendable. If it is ever emptied a LIVE run (crown-config
# gapFill.dryRun=false) sends nothing and records TEMPLATES_NOT_CONFIGURED —
# a dry run needs no template.
WA_GAPFILL = '{"templateName":"bosluk_teklifi","languageCode":"tr","body":[]}'

# The automatic Google review request — the MARKETING template
# pyz_google_yorum_istegi (approved at Meta, tr, no variables; its URL
# button lands on the Royal Diamond review page — checked on the owner's own
# phone 15 Eylül 2026), sent by the 19:00 cron tick (runReviewAsk) to the
# customers marked 😊 Memnun at checkout. Same contract as WA_GAPFILL:
# emptied, a LIVE run (crown-config reviewAsk.dryRun=false) sends nothing
# and records TEMPLATES_NOT_CONFIGURED — a dry run needs no template.
WA_REVIEW = '{"templateName":"pyz_google_yorum_istegi","languageCode":"tr","body":[]}'

# EVERY REPLY ONTO RECEPTION'S OWN TELEPHONE.
# The salon has two numbers: reception works from 0548 893 33 33 (ordinary
# WhatsApp, on her phone) and everything automatic goes out from 0539 140 3333
# (Piyzi), so that is where customers reply — and 0548 never sees it. A
# customer cancelled to 0539 and nobody saw it for a day; the hour could not be
# sold either. WhatsApp cannot divert one number to another, so /wa/hook
# forwards each reply itself (hookForward) as the template in
# templates/forward-reply.md: UTILITY, tr, two body variables, {who} and
# {said}. Empty = off, logged, never guessed — the same contract as the rest.
# Fill both in and `wrangler deploy` once Meta approves `musteri_yazdi`.
WA_FORWARD = ''
WA_FORWARD_TO = '905488933333'

# The Piyzi webhook (/wa/hook) is signed with the whsec_… key Piyzi shows
# ONCE when the webhook is registered. It is the wrangler secret
# PIYZI_WEBHOOK_SECRET — never here. Without it the route answers 503 and
# reads nothing. See README.md, "The Piyzi webhook".
