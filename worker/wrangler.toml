# The relay between the wall buttons and Firebase. See README.md — deploying it
# is `wrangler deploy` from this folder, and the two secrets are set once with
# `wrangler secret put` and never written down here.
name = "rd-buttons"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# The morning reminders. Cloudflare cron speaks only UTC, and 06:00 at the
# salon is not one UTC hour: Northern Cyprus moved back to seasonal clocks in
# 2017, so six in the morning is 03:00 UTC in summer and 04:00 UTC in winter.
# Both hours are scheduled, and the worker itself asks what time it is in
# Asia/Nicosia — the firing that is not 06:00 there leaves without doing
# anything. Exactly one of the two can be six o'clock on any given day, the
# clock-change Sundays included, so a reminder can never go out twice.
[triggers]
crons = ["0 3 * * *", "0 4 * * *"]

# The confirm-page store. Each key holds ONE appointment's public face — date,
# time, service, and the customer's answer — and nothing else: no name, no
# phone, no price. The armed app pushes records here behind the shared key;
# the /r/ page reads them; answers travel back to the app by polling. No
# Firebase credential ever sits on this worker.
[[kv_namespaces]]
binding = "RD_WA"
id = "087711ff20264efe9e6aadfacaf945e1"

# The reminders' master switch. "off" means the six-o'clock firing only writes
# a log line; nothing is read as a batch, nothing is sent. Turning it on is a
# one-word edit here plus a deploy — deliberate and visible in git, never an
# accident. The gateway credentials and the database secret are wrangler
# secrets (SMSGATE_LOGIN, SMSGATE_PASSWORD, FB_SECRET), never in this file.
[vars]
SMS_REMINDERS = "off"

# When the salon opens, HH:MM on the salon's own clock. The 2-hour WhatsApp
# goes ONLY to appointments whose one-hour call moment falls before reception
# is at the desk (this time minus ten minutes) — with 08:00 that means the
# 08:00 and 08:30 starts and nobody else, because everyone else gets the
# 1 SAAT KALA phone call instead. Change the opening here and the line moves
# with it. Keep in step with CROWN.openTime in crown-config.js.
WA_OPEN = "08:00"

# The two WhatsApp reminder templates, sent through Piyzi (routes under /wa/).
# Empty means "not configured yet": /wa/schedule refuses with
# TEMPLATES_NOT_CONFIGURED instead of sending under a guessed name that would
# fail silently at Piyzi's end. To fill them in, call GET /wa/templates (see
# README) and copy each template's REAL name and variable order from its
# examplePayload. The value is one JSON object per template:
#
#   WA_R24 = '{"templateName":"<name from /wa/templates>","languageCode":"tr","body":["{name}","{when}"]}'
#
# Placeholders the worker substitutes per appointment: {name} {service}
# {date} (YYYY-MM-DD) {time} (HH:MM) {when} ("1 Eylül 14:00", salon clock).
# header/body arrays must match the template's variableCounts exactly —
# Piyzi rejects a mismatch. The Piyzi key itself is NEVER here: it is the
# wrangler secret PIYZI_API_KEY, set by the owner.
# Filled 29 Aug 2026 from the live GET /wa/templates response. Both approved
# templates carry ONE body variable (the appointment hour) and ONE dynamic URL
# button whose link is this worker's own /r/{{1}} page — the button value is
# the apptId, so the customer's "Detaylar / Details" tap lands somewhere real.
WA_R24 = '{"templateName":"pyz_randevu_hatirlatma_24saat","languageCode":"tr","body":["{time}"],"buttons":{"0":"{apptId}"}}'
WA_R1 = '{"templateName":"pyz_randevu_hatirlatma_2saat","languageCode":"tr","body":["{time}"],"buttons":{"0":"{apptId}"}}'
