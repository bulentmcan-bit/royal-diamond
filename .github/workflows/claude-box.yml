Perfect — that's all I needed to see. Every step is green, but notice there's no step that opens a pull request. The action edited the file in its temporary workspace, then the job ended and those edits vanished — nothing committed them or pushed a branch. So we need to add a dedicated "open the pull request" step to the workflow. That makes it reliable every single time.

There are two small changes, and then we re-run. Let's do them one at a time.

Change 1 — turn on a GitHub permission. GitHub blocks Actions from opening pull requests by default; we need to allow it.

