Paste in this new version:
yaml
name: Change Box
run-name: "Box · ${{ inputs.ticket }} · ${{ inputs.request }}"

on:
  workflow_dispatch:
    inputs:
      request:
        description: "What to change"
        required: true
        type: string
      ticket:
        description: "Tracking id (set automatically by the app)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: change-box
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 25"
          prompt: |
            You are handling a change request submitted through the "Change Box" app.
            Tracking id: ${{ inputs.ticket }}

            The requested change is:
            ---
            ${{ inputs.request }}
            ---

            Make the change by EDITING FILES in this repository directly.
            - Make the smallest, cleanest change that fully satisfies the request.
            - Do NOT create branches, commits, or pull requests yourself, and do
              NOT run any git commands. Just leave your edited files in place.
              A later step commits them and opens the pull request.
            - If the request is unclear or impossible, make no file changes and
              explain why in your final message.

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: box/${{ inputs.ticket }}
          base: main
          commit-message: "[${{ inputs.ticket }}] ${{ inputs.request }}"
          title: "[${{ inputs.ticket }}] ${{ inputs.request }}"
          body: |
            Automated change from the Change Box app.

            Request: ${{ inputs.request }}
            Ticket: ${{ inputs.ticket }}
          delete-branch: true
Click Commit changes… (top-right), keep "Commit directly to the main branch", and confirm.
