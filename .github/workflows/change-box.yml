name: Change Box
run-name: "Box · ${{ inputs.ticket }} · ${{ inputs.request }}"

on:
  workflow_dispatch:
    inputs:
      request:
        description: "What to change"
        required: true
        type: string
      ticket:
        description: "Tracking id (set automatically by the app)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: change-box
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REQUEST: ${{ inputs.request }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "You are working inside a git repository in the current directory. Edit the files to satisfy this change request, then stop. Make the smallest, cleanest change that fully satisfies it. Do not run git, do not commit, and do not push — another step does that. Change request: ${REQUEST}" --dangerously-skip-permissions

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST: ${{ inputs.request }}
          TICKET: ${{ inputs.ticket }}
        run: |
          git config user.name "Change Box"
          git config user.email "actions@users.noreply.github.com"
          echo "----- changed files -----"
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes were made — nothing to open a PR for."
            exit 0
          fi
          BRANCH="box/${TICKET}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "[${TICKET}] ${REQUEST}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "[${TICKET}] ${REQUEST}" --body "Automated change from the Change Box app. Request: ${REQUEST} (ticket ${TICKET})"
