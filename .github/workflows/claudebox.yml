name: Change Box
run-name: "Box · ${{ inputs.ticket }} · ${{ inputs.request }}"

on:
  workflow_dispatch:
    inputs:
      request:
        description: "What to change"
        required: true
        type: string
      ticket:
        description: "Tracking id (set automatically by the app)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: change-box
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 25"
          prompt: |
            Edit the files in this repository to satisfy the request below.
            Only edit files. Do NOT run git, do NOT commit, and do NOT open a
            pull request — another step handles that. Just make the file edits
            and stop.

            Request: ${{ inputs.request }}

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST: ${{ inputs.request }}
          TICKET: ${{ inputs.ticket }}
        run: |
          git config user.name "Change Box"
          git config user.email "actions@users.noreply.github.com"
          echo "----- changed files -----"
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No file changes were made — nothing to open a PR for."
            exit 0
          fi
          BRANCH="box/${TICKET}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "[${TICKET}] ${REQUEST}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "[${TICKET}] ${REQUEST}" --body "Automated change from the Change Box app. Request: ${REQUEST} (ticket ${TICKET})"
